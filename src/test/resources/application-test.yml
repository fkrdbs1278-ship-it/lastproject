# 최종 통합 테스트 프로필
# DB 접속정보는 운영 코드와 동일하게 환경변수(DB_URL / DB_USERNAME / DB_PASSWORD)를 사용한다.
# 실제 운영 DB가 아닌 테스트용 Oracle Schema 사용을 권장한다.

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
    open-in-view: false

file:
  upload-dir: build/final-test-uploads
  siteadmin-upload-dir: build/final-test-siteadmin-upload

sms:
  provider: log

logging:
  level:
    root: info
    com.young04.lastproject: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
