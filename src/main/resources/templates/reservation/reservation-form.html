<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약하기</title>

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <link rel="stylesheet"
          th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<main class="reservation-page"
      id="reservationPage"
      th:attr="data-member-no=${memberNo},
               data-logged-in=${isLoggedIn}">

    <section class="page-heading">
        <div>
            <p class="eyebrow">SALON RESERVATION</p>
            <h1>예약하기</h1>
            <p>시술과 날짜를 선택하면 예약 가능한 시간을 확인할 수 있습니다.</p>
        </div>

        <a class="secondary-button"
           th:href="@{/my-reservations}">
            내 예약
        </a>
    </section>

    <section class="reservation-grid">
        <div class="panel">
            <h2>1. 시술 선택</h2>

            <div th:if="${#lists.isEmpty(serviceMenus)}"
                 class="empty-box">
                현재 예약 가능한 시술 메뉴가 없습니다.
            </div>

            <div class="menu-list"
                 th:unless="${#lists.isEmpty(serviceMenus)}">
                <label class="menu-card"
                       th:each="menu : ${serviceMenus}">
                    <input type="radio"
                           name="serviceMenu"
                           th:value="${menu.serviceMenuNo}"
                           th:attr="data-duration=${menu.durationMin}"
                           class="menu-radio">

                    <span class="menu-content">
                        <span class="menu-category"
                              th:text="${menu.category}">
                            CUT
                        </span>
                        <strong th:text="${menu.name}">
                            커트
                        </strong>
                        <span>
                            <span th:text="${#numbers.formatInteger(menu.price, 1, 'COMMA')}">
                                20000
                            </span>원 ·
                            <span th:text="${menu.durationMin}">
                                30
                            </span>분
                        </span>
                    </span>
                </label>
            </div>
        </div>

        <div class="panel">
            <h2>2. 날짜 선택</h2>

            <label class="field">
                <span>예약 날짜</span>
                <input type="date"
                       id="reservationDate">
            </label>

            <p class="field-help">
                일요일 및 휴무일에는 예약할 수 없습니다.
            </p>

            <div id="timeSection"
                 class="time-section hidden">
                <h3>예약 가능 시간</h3>
                <div id="timeSlots"
                     class="time-slots"></div>
            </div>
        </div>

        <div class="panel">
            <h2>3. 고객 정보</h2>

            <div th:if="${isLoggedIn}"
                 class="member-notice">
                로그인된 회원 정보로 예약합니다.
            </div>

            <div th:unless="${isLoggedIn}"
                 class="guest-fields">
                <p class="guest-title">
                    비회원 예약
                </p>

                <label class="field">
                    <span>이름</span>
                    <input type="text"
                           id="guestName"
                           maxlength="50"
                           placeholder="예약자 이름">
                </label>

                <label class="field">
                    <span>휴대전화</span>
                    <input type="tel"
                           id="guestPhone"
                           maxlength="20"
                           placeholder="01012345678">
                </label>
            </div>

            <label class="field">
                <span>요청사항</span>
                <textarea id="requestMemo"
                          maxlength="1000"
                          rows="5"
                          placeholder="원하는 스타일이나 참고사항을 입력하세요."></textarea>
            </label>
        </div>

        <div class="panel">
            <h2>4. 참고 이미지</h2>

            <label class="file-drop">
                <input type="file"
                       id="reservationImages"
                       accept="image/jpeg,image/png,image/webp"
                       multiple>
                <strong>사진 선택</strong>
                <span>JPG, PNG, WEBP / 최대 3장 / 장당 10MB</span>
            </label>

            <div id="imagePreview"
                 class="image-preview"></div>

            <p class="field-help">
                예약 생성이 완료된 후 이미지가 순서대로 업로드됩니다.
            </p>
        </div>
    </section>

    <section class="submit-panel">
        <div id="reservationSummary"
             class="reservation-summary">
            시술, 날짜, 시간을 선택해주세요.
        </div>

        <button type="button"
                id="submitReservation"
                class="primary-button"
                disabled>
            예약 신청
        </button>
    </section>

    <div id="messageBox"
         class="message-box hidden"
         role="alert"></div>
</main>

<script th:src="@{/js/reservation/reservation-form.js}"></script>
</body>
</html>
