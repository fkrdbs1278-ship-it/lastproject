<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 예약</title>

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <link rel="stylesheet"
          th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<main class="reservation-page"
      id="myReservationPage"
      th:attr="data-member-no=${memberNo},
               data-logged-in=${isLoggedIn}">

    <section class="page-heading">
        <div>
            <p class="eyebrow">MY RESERVATION</p>
            <h1>내 예약</h1>
            <p>예약 상태와 시술 일정을 확인할 수 있습니다.</p>
        </div>

        <a class="primary-link"
           th:href="@{/reservation}">
            새 예약
        </a>
    </section>

    <section th:unless="${isLoggedIn}"
             class="panel empty-box">
        로그인한 회원만 내 예약을 조회할 수 있습니다.
    </section>

    <section th:if="${isLoggedIn}"
             class="panel">
        <div class="toolbar">
            <button type="button"
                    class="secondary-button"
                    id="refreshReservations">
                새로고침
            </button>
        </div>

        <div id="reservationList"
             class="reservation-list">
            <div class="loading-box">
                예약을 불러오는 중입니다.
            </div>
        </div>
    </section>


    <div id="memberDetailOverlay" class="detail-overlay hidden">
        <div class="detail-modal">
            <div class="section-title-row">
                <h2 id="memberDetailTitle">예약 상세</h2>
                <button id="closeMemberDetail"
                        type="button"
                        class="secondary-button">
                    닫기
                </button>
            </div>

            <div id="memberDetailContent"></div>
        </div>
    </div>

    <div id="memberEditOverlay" class="detail-overlay hidden">
        <div class="detail-modal">
            <div class="section-title-row">
                <h2>예약 변경</h2>
                <button id="closeMemberEdit"
                        type="button"
                        class="secondary-button">
                    닫기
                </button>
            </div>

            <form id="memberEditForm">
                <input type="hidden" id="editReservationNo">

                <label class="field">
                    <span>시술</span>
                    <select id="editServiceMenu" required></select>
                </label>

                <label class="field">
                    <span>날짜</span>
                    <input id="editDate" type="date" required>
                </label>

                <div class="field">
                    <span>예약 가능 시간</span>
                    <div id="editAvailabilityNotice" class="availability-notice hidden"></div>
                    <div id="editTimeSlots" class="time-slots"></div>
                </div>

                <label class="field">
                    <span>요청사항</span>
                    <textarea id="editRequestMemo"
                              rows="4"
                              maxlength="500"></textarea>
                </label>

                <div class="modal-actions">
                    <button type="submit" class="primary-button">
                        변경 저장
                    </button>
                    <button type="button"
                            id="cancelMemberEdit"
                            class="secondary-button">
                        취소
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="messageBox"
         class="message-box hidden"
         role="alert"></div>
</main>

<script th:src="@{/js/reservation/my-reservations.js}"></script>
</body>
</html>
