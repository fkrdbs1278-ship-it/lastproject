<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 예약</title>

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/layout/header.css}">
    <link rel="stylesheet" th:href="@{/css/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/css/member/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation-user.css}">
</head>
<body>

<header th:replace="~{layout/header :: header}"></header>

<main class="reservation-page my-reservation-page"
      id="myReservationPage"
      th:attr="data-member-no=${memberNo},
               data-logged-in=${isLoggedIn}">

    <section class="mypage-header reservation-user-heading">
        <div>
            <p class="mypage-eyebrow">MY RESERVATION</p>
            <h1>내 예약</h1>
            <p class="mypage-description">
                예약 상태와 시술 일정, 변경 및 취소 내역을 확인할 수 있습니다.
            </p>
        </div>

        <div class="reservation-page-actions">
            <a class="secondary-button" th:href="@{/}">메인페이지</a>
            <a class="secondary-button" th:href="@{/member/mypage}">마이페이지</a>
            <a class="primary-link" th:href="@{/reservation}">새 예약</a>
        </div>
    </section>

    <section th:unless="${isLoggedIn}"
             class="panel empty-box">
        로그인한 회원만 내 예약을 조회할 수 있습니다.
    </section>

    <section th:if="${isLoggedIn}"
             class="mypage-section">
        <div class="mypage-section-header">
            <div>
                <h2>예약 내역</h2>
                <p>최근 예약부터 확인할 수 있습니다.</p>
            </div>
        </div>

        <div class="mypage-info-card reservation-history-card">
        <div class="toolbar">
            <button type="button"
                    class="secondary-button"
                    id="refreshReservations">
                새로고침
            </button>
        </div>

        <div id="reservationList"
             class="reservation-list">
            <div class="loading-box">
                예약을 불러오는 중입니다.
            </div>
        </div>
        </div>
    </section>


    <div id="memberDetailOverlay" class="detail-overlay hidden">
        <div class="detail-modal">
            <div class="section-title-row">
                <h2 id="memberDetailTitle">예약 상세</h2>
                <button id="closeMemberDetail"
                        type="button"
                        class="secondary-button">
                    닫기
                </button>
            </div>

            <div id="memberDetailContent"></div>
        </div>
    </div>

    <div id="memberEditOverlay" class="detail-overlay hidden">
        <div class="detail-modal">
            <div class="section-title-row">
                <h2>예약 변경</h2>
                <button id="closeMemberEdit"
                        type="button"
                        class="secondary-button">
                    닫기
                </button>
            </div>

            <form id="memberEditForm">
                <input type="hidden" id="editReservationNo">

                <label class="field">
                    <span>시술</span>
                    <select id="editServiceMenu" required></select>
                </label>

                <label class="field">
                    <span>날짜</span>
                    <input id="editDate" type="date" required>
                    <small id="editDateHint" class="field-hint">오늘부터 1년 이내 날짜만 선택할 수 있습니다.</small>
                </label>

                <div class="field">
                    <span>예약 가능 시간</span>
                    <div id="editAvailabilityNotice" class="availability-notice hidden"></div>
                    <div id="editTimeSlots" class="time-slots"></div>
                </div>

                <label class="field">
                    <span>요청사항</span>
                    <textarea id="editRequestMemo"
                              rows="4"
                              maxlength="500"></textarea>
                </label>

                <div class="modal-actions">
                    <button type="submit" class="primary-button">
                        변경 저장
                    </button>
                    <button type="button"
                            id="cancelMemberEdit"
                            class="secondary-button">
                        취소
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="memberCancelOverlay"
         class="detail-overlay hidden">
        <div class="detail-modal cancel-reason-modal">
            <div class="section-title-row">
                <div>
                    <p class="cancel-modal-eyebrow">CANCEL RESERVATION</p>
                    <h2>예약 취소</h2>
                </div>
                <button id="closeMemberCancel"
                        type="button"
                        class="secondary-button">
                    닫기
                </button>
            </div>

            <p class="cancel-modal-description">
                예약 취소 사유를 입력해주세요. 취소 후에는 예약 상태가 취소로 변경됩니다.
            </p>

            <input type="hidden" id="cancelReservationNo">

            <label class="field">
                <span>취소 사유</span>
                <textarea id="cancelReason"
                          rows="4"
                          maxlength="200"
                          placeholder="예: 일정 변경으로 예약을 취소합니다."></textarea>
                <span class="counter"><span id="cancelReasonCount">0</span>/200</span>
            </label>

            <div class="modal-actions">
                <button id="confirmMemberCancel"
                        type="button"
                        class="danger-button">
                    예약 취소
                </button>
                <button id="cancelMemberCancel"
                        type="button"
                        class="secondary-button">
                    돌아가기
                </button>
            </div>
        </div>
    </div>

    <div id="messageBox"
         class="message-box hidden"
         role="alert"></div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script th:src="@{/js/reservation/my-reservations.js}"></script>
</body>
</html>
