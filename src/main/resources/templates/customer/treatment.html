<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="'고객 시술 이력 - ' + ${customer.customerName}">
        고객 시술 이력
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        .customer-info {
            margin-bottom: 25px;
        }

        .box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #f0f0f0;
        }

        .memo {
            text-align: left;
            white-space: pre-wrap;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #777;
        }

        a {
            color: #1565c0;
            margin-right: 10px;
        }
    </style>
</head>


<body>


<!-- =====================================================
     페이지 제목
===================================================== -->

<h1 th:text="'고객 시술 이력 - ' + ${customer.customerName}">
    고객 시술 이력
</h1>


<!-- =====================================================
     고객 정보 / 이동 메뉴
===================================================== -->

<div class="customer-info">

    고객번호:

    <strong th:text="${customerId}">
        0
    </strong>


    &nbsp; | &nbsp;


    고객명:

    <strong th:text="${customer.customerName}">
        고객명
    </strong>


    &nbsp; | &nbsp;


    <a th:href="@{/admin/customers/{customerId}(
        customerId=${customerId}
    )}">
        고객 상세
    </a>


    <a th:href="@{/admin/customers}">
        고객 목록으로
    </a>


    <a th:href="@{/admin/customers/{customerId}/memos(
        customerId=${customerId}
    )}">
        상담 메모 보기
    </a>

</div>


<!-- =====================================================
     시술 이력
===================================================== -->

<div class="box">

    <h2>
        시술 이력
    </h2>


    <!-- =================================================
         시술 이력이 존재하는 경우
    ================================================== -->

    <table th:if="${!#lists.isEmpty(treatments)}">

        <thead>

        <tr>
            <th>시술번호</th>
            <th>예약번호</th>
            <th>메뉴번호</th>
            <th>시술명</th>
            <th>시술일</th>
            <th>시술금액</th>
            <th>시술메모</th>
            <th>다음 추천일</th>
        </tr>

        </thead>


        <tbody>


        <tr th:each="treatment : ${treatments}">


            <!-- 시술 번호 -->

            <td th:text="${treatment.treatmentId}">
                1
            </td>


            <!-- 예약 번호 -->

            <td th:text="${treatment.reservationNo != null
                            ? treatment.reservationNo
                            : '-'}">
                -
            </td>


            <!-- 시술 메뉴 번호 -->

            <td th:text="${treatment.serviceMenuNo != null
                            ? treatment.serviceMenuNo
                            : '-'}">
                -
            </td>


            <!-- 시술명 -->

            <td th:text="${treatment.treatmentName}">
                여성 커트
            </td>


            <!-- 시술일 -->

            <td th:text="${treatment.treatmentDate}">
                2026-08-26
            </td>


            <!-- 시술 금액 -->

            <td>

                <span th:text="${treatment.treatmentPrice != null
                                ? #numbers.formatInteger(
                                    treatment.treatmentPrice,
                                    0,
                                    'COMMA'
                                  )
                                : '0'}">
                    35,000
                </span>

                원

            </td>


            <!-- 시술 메모 -->

            <td
                    class="memo"
                    th:text="${treatment.treatmentMemo != null
                                ? treatment.treatmentMemo
                                : '-'}">

                손상모 주의

            </td>


            <!-- 다음 추천일 -->

            <td th:text="${treatment.nextRecommendedDate != null
                            ? treatment.nextRecommendedDate
                            : '-'}">

                2026-09-26

            </td>


        </tr>


        </tbody>

    </table>


    <!-- =================================================
         시술 이력이 없는 경우
    ================================================== -->

    <div
            class="empty"
            th:if="${#lists.isEmpty(treatments)}">

        등록된 시술 이력이 없습니다.

    </div>

</div>


</body>

</html>
