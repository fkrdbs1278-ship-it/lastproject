<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>전화예약 고객 등록</title>


    <!-- =====================================================
         3part 고객 CRM 전용 사이드바 CSS
    ====================================================== -->

    <link rel="stylesheet"
          th:href="@{/css/customer/customer-sidebar.css}">


    <!-- =====================================================
         고객 등록 전용 CSS
    ====================================================== -->

    <link rel="stylesheet"
          th:href="@{/css/customer/create.css}">

    <script th:src="@{/js/customer/create.js}"
            defer>
    </script>

    <!-- 화면 크기에 따른 공통 배치 보완: 기존 CSS 다음에 유지 -->
    <link rel="stylesheet" th:href="@{/css/responsive.css(v=20260922)}">
</head>


<body class="responsive-page responsive-admin">


<!-- =========================================================
     3part 고객 CRM 전용 관리자 사이드바
========================================================= -->

<aside th:replace="~{customer/customer-sidebar :: sidebar('customer')}">
</aside>



<!-- =========================================================
     전화예약 고객 등록
========================================================= -->

<main class="create-page">


    <!-- =====================================================
         페이지 상단
    ====================================================== -->

    <header class="create-header">


        <div>

            <p class="page-label">
                CUSTOMER REGISTRATION
            </p>


            <h1>
                전화예약 고객 등록
            </h1>


            <p class="page-description">
                전화로 예약한 신규 고객을 고객 CRM에 직접 등록합니다.
            </p>

        </div>



        <a class="back-button"
           th:href="@{/admin/customers}">
            ← 고객 목록
        </a>


    </header>



    <!-- =====================================================
         등록 오류 메시지
    ====================================================== -->

    <div class="alert error"
         th:if="${errorMessage != null}"
         th:text="${errorMessage}">

        고객 등록 중 오류가 발생했습니다.

    </div>



    <!-- =====================================================
         고객 등록 카드
    ====================================================== -->

    <section class="create-panel">


        <!-- =================================================
             카드 제목
        ================================================== -->

        <div class="panel-header">


            <div>

                <p class="panel-label">
                    NEW CUSTOMER
                </p>


                <h2>
                    신규 고객 정보
                </h2>

            </div>


            <p>
                고객명과 전화번호를 입력해 주세요.
            </p>


        </div>



        <!-- =================================================
             고객 등록 Form
        ================================================== -->

        <form class="create-form"
              id="customerCreateForm"
              method="post"
              th:action="@{/admin/customers/new}"
              th:object="${customerCreateRequest}">


            <!-- =================================================
                 CSRF
            ================================================== -->

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">



            <!-- =================================================
                 고객명
            ================================================== -->

            <div class="form-group">


                <label for="customerName">

                    고객명

                    <span class="required">
                        *
                    </span>

                </label>


                <input type="text"
                       id="customerName"
                       class="form-control"
                       th:field="*{customerName}"
                       maxlength="50"
                       placeholder="고객명을 입력하세요."
                       autocomplete="off">


                <div class="field-error"
                     th:if="${#fields.hasErrors('customerName')}"
                     th:errors="*{customerName}">

                    고객명을 확인해 주세요.

                </div>

                <div class="field-error client-field-error"
                     id="customerNameClientError"
                     hidden>
                </div>


            </div>



            <!-- =================================================
                 전화번호
            ================================================== -->

            <div class="form-group">


                <label for="phone">

                    전화번호

                    <span class="required">
                        *
                    </span>

                </label>


                <input type="text"
                       id="phone"
                       class="form-control"
                       th:field="*{phone}"
                       maxlength="20"
                       placeholder="010-1234-5678"
                       autocomplete="off">


                <div class="input-guide">


                    <span class="guide-icon">
                        i
                    </span>


                    <span>
                        하이픈 없이 입력해도 등록 과정에서 표준 전화번호 형식으로 처리합니다.
                    </span>


                </div>


                <div class="field-error"
                     th:if="${#fields.hasErrors('phone')}"
                     th:errors="*{phone}">

                    전화번호를 확인해 주세요.

                </div>

                <div class="field-error client-field-error"
                     id="phoneClientError"
                     hidden>
                </div>


            </div>



            <div class="registration-summary">

                <strong>
                    등록 기본값
                </strong>

                <span>
                    비회원 · 일반 등급 · 자동 관리 · 방문/결제 0
                </span>

            </div>



            <!-- =================================================
                 하단 버튼
            ================================================== -->

            <div class="button-area">


                <a class="cancel-button"
                   th:href="@{/admin/customers}">
                    취소
                </a>


                <button type="submit"
                        id="submitButton"
                        class="submit-button">
                    고객 등록
                </button>


            </div>


        </form>


    </section>


</main>


</body>

</html>
