<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>고객 CRM 목록 QA 테스트</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 20px;
        }

        .box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .search-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: end;
        }

        .search-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .search-item label {
            font-size: 13px;
        }

        input,
        select,
        button {
            padding: 7px 9px;
        }

        button {
            cursor: pointer;
        }

        .reset-button {
            display: inline-block;
            padding: 7px 11px;
            border: 1px solid #777;
            color: #333;
            text-decoration: none;
            background: white;
        }

        .summary {
            margin-bottom: 12px;
            color: #555;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 9px;
            text-align: center;
        }

        th {
            background: #f0f0f0;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .grade-normal {
            color: #555;
            font-weight: bold;
        }

        .grade-regular {
            color: #1976d2;
            font-weight: bold;
        }

        .grade-vip {
            color: #d32f2f;
            font-weight: bold;
        }

        .manual {
            color: #d32f2f;
            font-weight: bold;
        }

        .automatic {
            color: #1976d2;
            font-weight: bold;
        }

        .active {
            color: #2e7d32;
            font-weight: bold;
        }

        .inactive {
            color: #777;
            font-weight: bold;
        }

        .revisit-due {
            color: #d32f2f;
            font-weight: bold;
        }

        .detail-button {
            display: inline-block;
            padding: 6px 10px;
            border: 1px solid #1565c0;
            border-radius: 4px;
            color: #1565c0;
            text-decoration: none;
        }

        .detail-button:hover {
            background: #1565c0;
            color: white;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>


<!-- ===================================================== -->
<!-- 제목 -->
<!-- ===================================================== -->

<h1>고객 CRM 목록 QA 테스트</h1>


<!-- ===================================================== -->
<!-- 고객 검색 -->
<!-- ===================================================== -->

<div class="box">

    <h2>고객 검색</h2>

    <form
            method="get"
            th:action="@{/admin/customers}"
            th:object="${condition}">

        <div class="search-area">


            <!-- ================================================= -->
            <!-- 이름 / 전화번호 -->
            <!-- ================================================= -->

            <div class="search-item">

                <label for="keyword">
                    이름 / 전화번호
                </label>

                <input
                        type="text"
                        id="keyword"
                        th:field="*{keyword}"
                        placeholder="고객명 또는 전화번호">

            </div>


            <!-- ================================================= -->
            <!-- 고객 유형 -->
            <!-- ================================================= -->

            <div class="search-item">

                <label for="customerType">
                    고객유형
                </label>

                <select
                        id="customerType"
                        th:field="*{customerType}">

                    <option value="">
                        전체
                    </option>

                    <option value="MEMBER">
                        회원
                    </option>

                    <option value="GUEST">
                        비회원
                    </option>

                </select>

            </div>


            <!-- ================================================= -->
            <!-- 고객 등급 -->
            <!-- ================================================= -->

            <div class="search-item">

                <label for="gradeCode">
                    고객등급
                </label>

                <select
                        id="gradeCode"
                        th:field="*{gradeCode}">

                    <option value="">
                        전체
                    </option>

                    <option
                            th:each="grade : ${grades}"
                            th:value="${grade.gradeCode}"
                            th:text="${grade.gradeName
                                     + ' ('
                                     + grade.gradeCode
                                     + ')'}">

                        일반 (NORMAL)

                    </option>

                </select>

            </div>


            <!-- ================================================= -->
            <!-- 활성 여부 -->
            <!-- ================================================= -->

            <div class="search-item">

                <label for="activeYn">
                    활성여부
                </label>

                <select
                        id="activeYn"
                        th:field="*{activeYn}">

                    <option value="">
                        전체
                    </option>

                    <option value="Y">
                        활성
                    </option>

                    <option value="N">
                        비활성
                    </option>

                </select>

            </div>


            <!-- ================================================= -->
            <!-- 미방문 기간 -->
            <!-- ================================================= -->

            <div class="search-item">

                <label for="inactiveDays">
                    미방문 기간
                </label>

                <select
                        id="inactiveDays"
                        th:field="*{inactiveDays}">

                    <option value="">
                        전체
                    </option>

                    <option value="30">
                        30일 이상 미방문
                    </option>

                    <option value="60">
                        60일 이상 미방문
                    </option>

                </select>

            </div>


            <!-- ================================================= -->
            <!-- 재방문 대상 -->
            <!-- ================================================= -->

            <div class="search-item">

                <label for="revisitDueYn">
                    재방문 대상
                </label>

                <select
                        id="revisitDueYn"
                        th:field="*{revisitDueYn}">

                    <option value="">
                        전체
                    </option>

                    <option value="Y">
                        재방문 권장일 도래
                    </option>

                </select>

            </div>


            <!-- ================================================= -->
            <!-- 검색 버튼 -->
            <!-- ================================================= -->

            <div class="search-item">

                <button type="submit">
                    검색
                </button>

            </div>


            <!-- ================================================= -->
            <!-- 검색 초기화 -->
            <!-- ================================================= -->

            <div class="search-item">

                <a
                        class="reset-button"
                        th:href="@{/admin/customers}">
                    초기화
                </a>

            </div>

        </div>

    </form>

</div>


<!-- ===================================================== -->
<!-- 고객 목록 -->
<!-- ===================================================== -->

<div class="box">

    <h2>고객 목록</h2>


    <!-- ================================================= -->
    <!-- 검색 결과 개수 -->
    <!-- ================================================= -->

    <div class="summary">

        검색 결과:

        <strong
                th:text="${customers != null
                         ? #lists.size(customers)
                         : 0}">
            0
        </strong>

        명

    </div>


    <!-- ================================================= -->
    <!-- 검색 결과 없음 -->
    <!-- ================================================= -->

    <div
            class="empty"
            th:if="${customers == null
                   or #lists.isEmpty(customers)}">

        검색 조건에 해당하는 고객이 없습니다.

    </div>


    <!-- ================================================= -->
    <!-- 고객 목록 -->
    <!-- ================================================= -->

    <table
            th:if="${customers != null
                   and !#lists.isEmpty(customers)}">

        <thead>

        <tr>
            <th>고객번호</th>
            <th>고객명</th>
            <th>전화번호</th>
            <th>고객유형</th>
            <th>현재등급</th>
            <th>등급관리</th>
            <th>최근방문일</th>
            <th>방문횟수</th>
            <th>누적결제</th>
            <th>재방문 권장일</th>
            <th>활성여부</th>
            <th>상세</th>
        </tr>

        </thead>


        <tbody>

        <tr th:each="customer : ${customers}">


            <!-- 고객번호 -->
            <td th:text="${customer.customerId}">
                1
            </td>


            <!-- 고객명 -->
            <td th:text="${customer.customerName}">
                홍길동
            </td>


            <!-- 전화번호 -->
            <td th:text="${customer.phone}">
                01012345678
            </td>


            <!-- 고객유형 -->
            <td th:text="${customer.customerType}">
                GUEST
            </td>


            <!-- ================================================= -->
            <!-- 현재등급 -->
            <!-- ================================================= -->

            <td>

                <span
                        th:if="${customer.customerGrade != null}"
                        th:classappend="${customer.customerGrade.gradeCode == 'VIP'
                                        ? 'grade-vip'
                                        : (customer.customerGrade.gradeCode == 'REGULAR'
                                           ? 'grade-regular'
                                           : 'grade-normal')}">

                    <strong
                            th:text="${customer.customerGrade.gradeName}">
                        일반
                    </strong>

                    (

                    <span
                            th:text="${customer.customerGrade.gradeCode}">
                        NORMAL
                    </span>

                    )

                </span>


                <span
                        th:if="${customer.customerGrade == null}">
                    -
                </span>

            </td>


            <!-- ================================================= -->
            <!-- 자동 / 수동 등급 -->
            <!-- ================================================= -->

            <td>

                <span
                        class="manual"
                        th:if="${customer.gradeManualYn == 'Y'}">
                    수동
                </span>


                <span
                        class="automatic"
                        th:if="${customer.gradeManualYn == 'N'}">
                    자동
                </span>

            </td>


            <!-- ================================================= -->
            <!-- 최근 방문일 -->
            <!-- ================================================= -->

            <td th:text="${customer.lastVisitDate != null
                          ? customer.lastVisitDate
                          : '-'}">
                -
            </td>


            <!-- ================================================= -->
            <!-- 방문 횟수 -->
            <!-- ================================================= -->

            <td>

                <span
                        th:text="${customer.visitCount != null
                                 ? customer.visitCount
                                 : 0}">
                    0
                </span>

                회

            </td>


            <!-- ================================================= -->
            <!-- 누적 결제 -->
            <!-- ================================================= -->

            <td>

                <span
                        th:text="${customer.totalPayment != null
                                 ? #numbers.formatInteger(
                                       customer.totalPayment,
                                       0,
                                       'COMMA'
                                   )
                                 : '0'}">
                    0
                </span>

                원

            </td>


            <!-- ================================================= -->
            <!-- 재방문 권장일 -->
            <!-- ================================================= -->

            <td>

                <span
                        th:if="${customer.revisitRecommendedDate != null}"
                        th:text="${customer.revisitRecommendedDate}">
                    2026-08-26
                </span>


                <span
                        th:if="${customer.revisitRecommendedDate == null}">
                    -
                </span>

            </td>


            <!-- ================================================= -->
            <!-- 활성 여부 -->
            <!-- ================================================= -->

            <td>

                <span
                        class="active"
                        th:if="${customer.activeYn == 'Y'}">
                    활성
                </span>


                <span
                        class="inactive"
                        th:if="${customer.activeYn == 'N'}">
                    비활성
                </span>

            </td>


            <!-- ================================================= -->
            <!-- 상세 -->
            <!-- ================================================= -->

            <td>

                <a
                        class="detail-button"
                        th:href="@{/admin/customers/{customerId}(
                            customerId=${customer.customerId}
                        )}">

                    상세보기

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>


</body>
</html>
