<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>재고 변동 이력</title>

    <!-- 재고 이력 화면 CSS 연결 -->
    <link rel="stylesheet"
          th:href="@{/css/operation/stockhistory.css}">

    <!-- 관리자 공통 사이드바 CSS 연결 -->
    <link rel="stylesheet"
          th:href="@{/css/admin/dashboard-sidebar.css}">
</head>

<body>
<div class="admin-layout stockhistory-admin-layout">

    <!-- 관리자 공통 사이드바 표시 -->
    <aside th:replace="~{admin/dashboard-sidebar :: sidebar('material')}">
    </aside>

    <!-- 재고 변동 이력 화면 -->
    <div class="stockhistory-admin-content">
        <main class="stockhistory-page stockhistory-list-page">

            <!-- 화면 제목과 자재 목록 이동 -->
            <section class="page-header">
                <div>
                    <h1>재고 변동 이력</h1>
                    <p class="page-description">
                        자재의 입고, 사용, 폐기 및 수동 조정 내역을 확인합니다.
                    </p>
                </div>

                <a class="material-link"
                   th:href="@{/admin/material}">
                    자재 목록
                </a>
            </section>

            <!-- 자재 번호로 재고 이력 조회 -->
            <section class="filter-card">
                <form class="filter-form"
                      th:action="@{/admin/stockhistory}"
                      method="get">

                    <div class="filter-field">
                        <label for="materialNo">자재 번호</label>

                        <input id="materialNo"
                               type="number"
                               name="materialNo"
                               min="1"
                               step="1"
                               placeholder="자재 번호 입력"
                               th:value="${selectedMaterialNo}">
                    </div>

                    <div class="filter-buttons">
                        <button class="search-button" type="submit">
                            조회
                        </button>

                        <a class="reset-button"
                           th:href="@{/admin/stockhistory}">
                            초기화
                        </a>
                    </div>
                </form>
            </section>

            <!-- 재고 변동 내역 표시 -->
            <section class="history-card">
                <div class="table-header">
                    <h2>변동 내역</h2>

                    <span class="history-count"
                          th:text="|총 ${#lists.size(histories)}건|">
                        총 0건
                    </span>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th scope="col">번호</th>
                            <th scope="col">자재 번호</th>
                            <th scope="col">변동 유형</th>
                            <th scope="col">변동 수량</th>
                            <th scope="col"
                                title="변동 수량과 변경 전후 재고에 공통으로 적용되는 단위">
                                단위
                            </th>
                            <th scope="col">변경 전</th>
                            <th scope="col">변경 후</th>
                            <th scope="col">관련 유형</th>
                            <th scope="col">관련 번호</th>
                            <th scope="col">메모</th>
                            <th scope="col">기록 일시</th>
                        </tr>
                        </thead>

                        <tbody>

                        <!-- 조회 결과가 없을 때 안내 -->
                        <tr th:if="${#lists.isEmpty(histories)}">
                            <td colspan="11" class="empty-message">
                                등록된 재고 변동 이력이 없습니다.
                            </td>
                        </tr>

                        <!-- 조회된 재고 이력을 한 줄씩 표시 -->
                        <tr th:each="history : ${histories}">

                            <td th:text="${history.stockHistoryNo}">
                                1
                            </td>

                            <td th:text="${history.materialNo}">
                                1
                            </td>

                            <!-- 변동 유형에 맞는 명칭과 배지 표시 -->
                            <td>
                                <span class="movement-badge"
                                      th:classappend="${#strings.toLowerCase(history.movementType)}">

                                    <th:block th:switch="${history.movementType}">
                                        <span th:case="'PURCHASE_IN'">입고</span>
                                        <span th:case="'USE'">사용</span>
                                        <span th:case="'DISCARD'">폐기</span>
                                        <span th:case="'MANUAL_IN'">수동 증가</span>
                                        <span th:case="'MANUAL_OUT'">수동 감소</span>

                                        <span th:case="*"
                                              th:text="${#strings.isEmpty(history.movementType)
                                                  ? '-'
                                                  : history.movementType}">
                                            기타
                                        </span>
                                    </th:block>
                                </span>
                            </td>

                            <!-- 증가하거나 감소한 수량 표시 -->
                            <td th:text="${history.quantity}">
                                10
                            </td>

                            <!-- 변동 수량과 변경 전후 재고의 기록 당시 단위 표시 -->
                            <td>
                                <th:block th:switch="${history.unitCode}">
                                    <span th:case="'EA'">개</span>
                                    <span th:case="'BTL'">병</span>
                                    <span th:case="'TUB'">통</span>
                                    <span th:case="'PACK'">팩</span>
                                    <span th:case="'ROLL'">롤</span>
                                    <span th:case="'BOX'">박스</span>
                                    <span th:case="'SET'">세트</span>
                                    <span th:case="'ML'">ml</span>
                                    <span th:case="'G'">g</span>

                                    <!-- 기존 이력에 단위가 없으면 미기록으로 표시 -->
                                    <span th:case="*"
                                          th:text="${#strings.isEmpty(history.unitCode)
                                              ? '단위 미기록'
                                              : history.unitCode}">
                                        단위 미기록
                                    </span>
                                </th:block>
                            </td>

                            <!-- 재고 변경 전후 수량 표시 -->
                            <td th:text="${history.beforeStock}">
                                20
                            </td>

                            <td th:text="${history.afterStock}">
                                30
                            </td>

                            <!-- 이력을 발생시킨 업무 유형 표시 -->
                            <td>
                                <th:block th:switch="${history.referenceType}">
                                    <span th:case="'PURCHASE_ORDER'">발주</span>
                                    <span th:case="'MANUAL'">수동 조정</span>

                                    <span th:case="*"
                                          th:text="${#strings.isEmpty(history.referenceType)
                                              ? '-'
                                              : history.referenceType}">
                                        -
                                    </span>
                                </th:block>
                            </td>

                            <!-- 연결된 업무 번호 표시 -->
                            <td th:text="${history.referenceNo != null
                                ? history.referenceNo
                                : '-'}">
                                -
                            </td>

                            <!-- 기록된 사유와 참고 내용 표시 -->
                            <td class="memo-cell"
                                th:text="${#strings.isEmpty(history.memo)
                                    ? '-'
                                    : history.memo}">
                                -
                            </td>

                            <!-- 재고 이력 기록 시간 표시 -->
                            <td th:text="${history.regdate != null
                                ? #temporals.format(history.regdate, 'yyyy-MM-dd HH:mm')
                                : '-'}">
                                2026-09-07 10:00
                            </td>

                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

</div>
</body>
</html>
