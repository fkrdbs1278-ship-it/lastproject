<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>자재 관리</title>

    <link rel="stylesheet"
          th:href="@{/css/operation/material.css}">

    <!-- 관리자 공통 사이드바 CSS 연결 -->
    <link rel="stylesheet"
          th:href="@{/css/admin/dashboard-sidebar.css}">
</head>

<body>

<div class="admin-layout material-admin-layout">

    <!-- 관리자 공통 사이드바 -->
    <aside th:replace="~{admin/dashboard-sidebar
            :: sidebar('material')}">
    </aside>

    <!-- 자재 관리 화면 영역 -->
    <div class="material-admin-content">

        <main class="material-page">

            <section class="material-header">

                <div>
                    <h1>자재 관리</h1>
                    <p>매장에서 사용하는 자재와 현재 재고를 관리합니다.</p>
                </div>

                <div class="material-header-actions">

                    <a class="history-button"
                       th:href="@{/admin/purchaseorder}">
                        발주 관리
                    </a>

                    <a class="history-button"
                       th:href="@{/admin/stockhistory/adjustment}">
                        재고 조정
                    </a>

                    <!-- 시술별 기본 자재 설정 -->
                    <a class="history-button"
                       th:href="@{/admin/servicematerial}">
                        시술 자재 설정
                    </a>

                    <a class="primary-button"
                       th:href="@{/admin/material/new}">
                        자재 등록
                    </a>

                </div>

            </section>


            <!-- 처리 완료 메시지 -->
            <div class="message"
                 th:if="${message != null}"
                 th:text="${message}">
            </div>


            <!-- 자재 삭제 실패 메시지 -->
            <div class="message error-message"
                 th:if="${errorMessage != null}"
                 th:text="${errorMessage}">
            </div>


            <!-- 재고 부족 요약 -->
            <section class="material-summary">

                <a class="summary-card"
                   th:href="@{/admin/material(lowStock=true)}">

                    <span>재고 부족</span>

                    <strong th:text="${lowStockCount}">
                        0
                    </strong>

                    <small>안전 재고 이하</small>

                </a>

            </section>


            <!-- 검색 및 필터 -->
            <section class="material-filter">

                <div class="material-search-area">

                    <form class="search-form"
                          th:action="@{/admin/material}"
                          method="get">

                        <input type="search"
                               id="materialSearchInput"
                               name="keyword"
                               th:value="${keyword}"
                               maxlength="100"
                               autocomplete="off"
                               aria-controls="recentSearchPanel"
                               aria-expanded="false"
                               placeholder="자재명을 입력해 주세요.">

                        <button type="submit">
                            검색
                        </button>

                    </form>


                    <!-- 최근 검색어 -->
                    <div class="recent-search-panel"
                         id="recentSearchPanel"
                         hidden>

                        <!-- 검색창이 비어 있을 때 -->
                        <div id="recentSearchContent">

                            <div class="recent-search-header">

                                <strong>최근 검색어</strong>

                                <form th:if="${recentSearches != null
                                           and !#lists.isEmpty(recentSearches)}"
                                      th:action="@{/admin/material/searchhistory/clear}"
                                      method="post">

                                    <button type="submit"
                                            class="recent-search-clear">
                                        전체 삭제
                                    </button>

                                </form>

                            </div>


                            <p class="recent-search-empty"
                               th:if="${recentSearches == null
                                    or #lists.isEmpty(recentSearches)}">

                                최근 검색내역이 없습니다.

                            </p>


                            <ul class="recent-search-list"
                                th:if="${recentSearches != null
                                     and !#lists.isEmpty(recentSearches)}">

                                <li th:each="recentKeyword : ${recentSearches}">

                                    <a th:href="@{/admin/material(keyword=${recentKeyword})}"
                                       th:text="${recentKeyword}">
                                        검색어
                                    </a>

                                    <form th:action="@{/admin/material/searchhistory/remove}"
                                          method="post">

                                        <input type="hidden"
                                               name="recentKeyword"
                                               th:value="${recentKeyword}">

                                        <button type="submit"
                                                class="recent-search-remove"
                                                th:aria-label="${recentKeyword + ' 검색어 삭제'}">
                                            ×
                                        </button>

                                    </form>

                                </li>

                            </ul>

                        </div>


                        <!-- 검색창에 글자를 입력했을 때 -->
                        <div id="searchSuggestionContent"
                             hidden>

                            <ul class="search-suggestion-list"
                                id="searchSuggestionList">
                            </ul>

                            <p class="recent-search-empty"
                               id="searchSuggestionEmpty"
                               hidden>

                                일치하는 자재가 없습니다.

                            </p>

                        </div>

                    </div>

                </div>


                <!-- 상태 필터 -->
                <nav class="filter-buttons">

                    <a th:href="@{/admin/material}"
                       th:classappend="${keyword == null
                                      and useYn == null
                                      and !lowStock}
                                      ? 'active'">
                        전체
                    </a>

                    <a th:href="@{/admin/material(useYn='Y')}"
                       th:classappend="${useYn == 'Y'}
                                      ? 'active'">
                        사용 중
                    </a>

                    <a th:href="@{/admin/material(useYn='N')}"
                       th:classappend="${useYn == 'N'}
                                      ? 'active'">
                        사용 중지
                    </a>

                    <a th:href="@{/admin/material(lowStock=true)}"
                       th:classappend="${lowStock}
                                      ? 'active'">
                        재고 부족
                    </a>

                </nav>

            </section>


            <!-- 자재 목록 -->
            <section class="material-table-wrap">

                <table class="material-table">

                    <thead>

                    <tr>
                        <th>번호</th>
                        <th>자재명</th>
                        <th>자재 분류</th>

                        <th>현재 재고</th>

                        <th>개봉 잔여량</th>

                        <th>안전 재고</th>

                        <th>개당 구매가</th>
                        <th>업체명</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>

                    </thead>


                    <tbody>

                    <!-- 재고 부족 자재는 행 색상을 변경 -->
                    <tr th:each="material : ${materials}"
                        th:classappend="${material.lowStock}
                        ? 'low-stock-row'">


                        <!-- 번호 -->
                        <td th:text="${material.materialNo}">
                            1
                        </td>


                        <!-- 자재명 -->
                        <td>

                            <a class="material-name"
                               th:href="@{/admin/material/{no}
                               (no=${material.materialNo})}"
                               th:text="${material.materialName}">

                                자재명

                            </a>

                            <span class="low-stock-badge"
                                  th:if="${material.lowStock}">
                                부족
                            </span>

                        </td>


                        <!-- 자재 분류 -->
                        <td th:text="${material.categoryCode == 'HAIR_COLOR' ? '염색제' :
                                       material.categoryCode == 'PERM' ? '펌제' :
                                       material.categoryCode == 'TREATMENT' ? '클리닉·트리트먼트' :
                                       material.categoryCode == 'SHAMPOO' ? '샴푸·두피케어' :
                                       material.categoryCode == 'STYLING' ? '스타일링제' :
                                       material.categoryCode == 'SUPPLIES' ? '미용 소모품' :
                                       material.categoryCode == 'ETC' ? '기타' : '-'}">

                            -

                        </td>


                        <!-- 현재 보유 중인 자재 수량 -->
                        <td>

                            <span th:text="${#numbers.formatInteger(
                                    material.currentStock, 1
                            )}">
                                0
                            </span>

                            <span th:text="${material.unitCode}">
                                EA
                            </span>

                        </td>


                        <!-- 현재 개봉해서 사용 중인 자재의 남은 양 -->
                        <td>

                            <th:block th:if="${material.openRemainingQuantity != null}">

                                <span th:text="${material.openRemainingQuantity
                                                .stripTrailingZeros()
                                                .toPlainString()}">
                                    0
                                </span>

                                <span th:text="${material.usageUnitCode == 'ML' ? 'ml' :
                                                material.usageUnitCode == 'G' ? 'g' :
                                                material.usageUnitCode == 'EA' ? '개' : ''}">
                                </span>

                            </th:block>


                            <!-- 아직 개봉 잔여량이 등록되지 않은 경우 -->
                            <span th:unless="${material.openRemainingQuantity != null}">
                                -
                            </span>

                        </td>


                        <!-- 안전 재고 -->
                        <td>

                            <span th:text="${#numbers.formatInteger(
                                    material.safetyStock, 1
                            )}">
                                0
                            </span>

                            <span th:text="${material.unitCode}">
                                EA
                            </span>

                        </td>


                        <!-- 개당 구매가 -->
                        <td th:text="${#numbers.formatInteger(
                                material.unitPrice, 1, 'COMMA'
                        ) + '원'}">

                            0원

                        </td>


                        <!-- 업체명 -->
                        <td th:text="${material.supplierName != null
                                ? material.supplierName : '-'}">

                            -

                        </td>


                        <!-- 상태 -->
                        <td>

                            <span class="status-badge active"
                                  th:if="${material.useYn == 'Y'}">

                                사용 중

                            </span>


                            <span class="status-badge inactive"
                                  th:if="${material.useYn == 'N'}">

                                사용 중지

                            </span>

                        </td>


                        <!-- 관리 -->
                        <td class="manage-cell">

                            <a class="edit-button"
                               th:href="@{/admin/material/{no}/edit
                               (no=${material.materialNo})}">

                                수정

                            </a>


                            <!-- 사용 중지된 자재에만 삭제 버튼 표시 -->
                            <form class="delete-form"
                                  th:if="${material.useYn == 'N'}"
                                  th:action="@{/admin/material/{no}/delete(
                                  no=${material.materialNo}
                                  )}"
                                  method="post"
                                  onsubmit="return confirm('이 자재를 삭제하면 연결된 발주 품목과 재고 이력도 함께 삭제됩니다. 계속하시겠습니까?');">

                                <button class="delete-button"
                                        type="submit">

                                    삭제

                                </button>

                            </form>

                        </td>

                    </tr>


                    <!-- 조회된 자재가 없을 때 -->
                    <tr th:if="${#lists.isEmpty(materials)}">

                        <td class="empty-message"
                            colspan="10">

                            조회된 자재가 없습니다.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </section>


            <!-- 페이지 번호 -->
            <nav class="pagination"
                 aria-label="자재 목록 페이지">


                <!-- 이전 -->
                <a class="page-button"
                   th:classappend="${currentPage == 0}
                   ? 'disabled'"
                   th:href="${currentPage == 0}
                   ? '#'
                   : @{/admin/material(
                        page=${currentPage - 1},
                        keyword=${keyword},
                        useYn=${useYn},
                        lowStock=${lowStock}
                     )}"
                   aria-label="이전 페이지">

                    ‹

                </a>


                <!-- 페이지 번호 -->
                <a class="page-number"
                   th:each="pageNumber :
                   ${#numbers.sequence(startPage, endPage)}"
                   th:classappend="${pageNumber == currentPage}
                   ? 'active'"
                   th:href="@{/admin/material(
                        page=${pageNumber},
                        keyword=${keyword},
                        useYn=${useYn},
                        lowStock=${lowStock}
                   )}"
                   th:text="${pageNumber + 1}">

                    1

                </a>


                <!-- 다음 -->
                <a class="page-button"
                   th:classappend="${materialPage.totalPages <= 1
                                   or materialPage.last}
                   ? 'disabled'"
                   th:href="${materialPage.totalPages <= 1
                             or materialPage.last}
                   ? '#'
                   : @{/admin/material(
                        page=${currentPage + 1},
                        keyword=${keyword},
                        useYn=${useYn},
                        lowStock=${lowStock}
                     )}"
                   aria-label="다음 페이지">

                    ›

                </a>

            </nav>

        </main>

    </div>

</div>


<script th:src="@{/js/operation/materiallist.js}"></script>

</body>
</html>
