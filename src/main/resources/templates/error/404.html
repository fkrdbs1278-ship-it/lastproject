<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 | SALON CRM</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/layout/header.css}">
    <link rel="stylesheet" th:href="@{/css/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/css/error/error.css}">
    <!-- 화면 크기에 따른 공통 배치 보완: 기존 CSS 다음에 유지 -->
    <link rel="stylesheet" th:href="@{/css/responsive.css(v=20260922)}">
</head>
<body class="responsive-page">
<header th:replace="~{layout/header :: header}"></header>

<main class="error-page">
    <div class="error-container">
        <section class="error-card" aria-labelledby="errorTitle">
            <p class="error-eyebrow">NOT FOUND</p>
            <p class="error-code" aria-hidden="true">404</p>
            <h1 class="error-title" id="errorTitle">페이지를 찾을 수 없습니다.</h1>
            <p class="error-description">주소가 잘못되었거나 이동 또는 삭제된 페이지일 수 있습니다.</p>
            <p class="error-help">주소를 다시 확인하거나 아래 메뉴를 이용해 주세요.</p>

            <div class="error-actions">
                <a class="error-button error-button-primary"
                   th:href="@{/}">홈으로</a>
                <a class="error-button error-button-secondary"
                   th:href="@{/reservation}">예약하기</a>
            </div>

            <p class="error-note">문제가 계속되면 잠시 후 다시 시도해 주세요.</p>
        </section>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
