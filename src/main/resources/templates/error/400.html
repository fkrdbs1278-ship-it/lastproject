<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>400 | SALON CRM</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/layout/header.css}">
    <link rel="stylesheet" th:href="@{/css/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/css/error/error.css}">
    <!-- 화면 크기에 따른 공통 배치 보완: 기존 CSS 다음에 유지 -->
    <link rel="stylesheet" th:href="@{/css/responsive.css(v=20260922)}">
</head>
<body class="responsive-page">
<header th:replace="~{layout/header :: header}"></header>

<main class="error-page">
    <div class="error-container">
        <section class="error-card" aria-labelledby="errorTitle">
            <p class="error-eyebrow">BAD REQUEST</p>
            <p class="error-code" aria-hidden="true">400</p>
            <h1 class="error-title" id="errorTitle">요청 내용을 확인해 주세요.</h1>
            <p class="error-description">입력값이나 요청 형식이 올바르지 않아 요청을 처리하지 못했습니다.</p>
            <p class="error-help">입력한 내용을 다시 확인한 뒤 요청해 주세요.</p>

            <div class="error-actions">
                <a class="error-button error-button-primary"
                   th:href="@{/}">홈으로</a>
                <a class="error-button error-button-secondary"
                   th:href="@{/reservation}">예약 페이지</a>
            </div>

            <p class="error-note">문제가 계속되면 잠시 후 다시 시도해 주세요.</p>
        </section>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
