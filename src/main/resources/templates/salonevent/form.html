<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title th:text="${formMode == 'create'
                     ? '이벤트 등록'
                     : '이벤트 수정'}">
        이벤트 등록
    </title>

    <link rel="stylesheet"
          th:href="@{/css/operation/salonevent.css}">
</head>

<body>

<main class="salon-event-page event-form-page">

    <!-- 페이지 제목과 목록 이동 버튼 -->
    <section class="salon-event-header">
        <div>

            <h1 th:text="${formMode == 'create'
                         ? '이벤트 등록'
                         : '이벤트 수정'}">
                이벤트 등록
            </h1>

            <p>이벤트의 기본 정보와 진행 기간을 입력합니다.</p>
        </div>

        <div class="salon-event-header-actions">
            <a class="secondary-button"
               th:href="@{/admin/salonevent}">
                목록으로
            </a>
        </div>
    </section>

    <!-- 이벤트 등록 및 수정 입력 영역 -->
    <section class="event-form-section">

        <form th:object="${eventRequest}"
              th:action="${formMode == 'create'}
                    ? @{/admin/salonevent/new}
                    : @{/admin/salonevent/{no}/edit(
                        no=${eventNo}
                      )}"
              method="post">

            <!-- 시작일과 종료일 등 공통 검증 오류 -->
            <div class="form-error-summary"
                 th:if="${#fields.hasGlobalErrors()}">

                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}">
                    입력값을 다시 확인해 주세요.
                </p>
            </div>

            <div class="event-form-grid">

                <!-- 이벤트 제목 -->
                <div class="form-group full-width">
                    <label for="eventTitle">
                        이벤트명
                        <span class="required">*</span>
                    </label>

                    <input id="eventTitle"
                           type="text"
                           maxlength="200"
                           th:field="*{eventTitle}"
                           placeholder="예: 첫 방문 고객 20% 할인">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('eventTitle')}"
                       th:errors="*{eventTitle}">
                        이벤트 제목 오류
                    </p>
                </div>

                <!-- 이벤트 유형 -->
                <div class="form-group">
                    <label for="eventType">
                        이벤트 유형
                        <span class="required">*</span>
                    </label>

                    <select id="eventType"
                            th:field="*{eventType}">
                        <option value="">
                            이벤트 유형을 선택해 주세요.
                        </option>

                        <option value="FIRST_VISIT">
                            첫 방문
                        </option>

                        <option value="SEASON">
                            시즌
                        </option>

                        <option value="PARTNERSHIP">
                            제휴
                        </option>

                        <option value="PREPAID">
                            선불권
                        </option>

                        <option value="GENERAL">
                            일반
                        </option>
                    </select>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('eventType')}"
                       th:errors="*{eventType}">
                        이벤트 유형 오류
                    </p>
                </div>

                <!-- 사용자 화면 노출 여부 -->
                <div class="form-group">
                    <label for="useYn">
                        노출 상태
                        <span class="required">*</span>
                    </label>

                    <select id="useYn"
                            th:field="*{useYn}">
                        <option value="Y">
                            노출
                        </option>

                        <option value="N">
                            숨김
                        </option>
                    </select>

                    <p class="form-help">
                        숨김을 선택하면 사용자 화면에 표시되지 않습니다.
                    </p>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('useYn')}"
                       th:errors="*{useYn}">
                        노출 상태 오류
                    </p>
                </div>

                <!-- 이벤트 시작일 -->
                <div class="form-group">
                    <label for="startDate">
                        시작일
                        <span class="required">*</span>
                    </label>

                    <input id="startDate"
                           type="datetime-local"
                           step="60"
                           th:field="*{startDate}">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('startDate')}"
                       th:errors="*{startDate}">
                        시작일 오류
                    </p>
                </div>

                <!-- 이벤트 종료일 -->
                <div class="form-group">
                    <label for="endDate">
                        종료일
                        <span class="required">*</span>
                    </label>

                    <input id="endDate"
                           type="datetime-local"
                           step="60"
                           th:field="*{endDate}">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('endDate')}"
                       th:errors="*{endDate}">
                        종료일 오류
                    </p>
                </div>

                <!-- 이벤트 이미지 URL -->
                <div class="form-group full-width">
                    <label for="eventImageUrl">
                        이벤트 이미지 주소
                    </label>

                    <input id="eventImageUrl"
                           type="url"
                           maxlength="500"
                           th:field="*{eventImageUrl}"
                           placeholder="예: https://example.com/event-image.jpg">

                    <p class="form-help">
                        이미지 업로드 기능을 추가하기 전까지는
                        이미지 주소를 입력할 수 있습니다.
                    </p>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('eventImageUrl')}"
                       th:errors="*{eventImageUrl}">
                        이미지 주소 오류
                    </p>
                </div>

                <!-- 이벤트 상세 내용 -->
                <div class="form-group full-width">
                    <label for="eventContent">
                        이벤트 내용
                    </label>

                    <textarea id="eventContent"
                              rows="9"
                              maxlength="2000"
                              th:field="*{eventContent}"
                              placeholder="이벤트 대상과 혜택 내용을 입력해 주세요."></textarea>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('eventContent')}"
                       th:errors="*{eventContent}">
                        이벤트 내용 오류
                    </p>
                </div>

            </div>

            <!-- 등록 및 수정 버튼 -->
            <div class="event-form-actions">
                <a class="secondary-button"
                   th:href="${formMode == 'create'}
                        ? @{/admin/salonevent}
                        : @{/admin/salonevent/{no}(
                            no=${eventNo}
                          )}">
                    취소
                </a>

                <button type="submit"
                        class="primary-button"
                        th:text="${formMode == 'create'
                                 ? '등록하기'
                                 : '수정하기'}">
                    등록하기
                </button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
