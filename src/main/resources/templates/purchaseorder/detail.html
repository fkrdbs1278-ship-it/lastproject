<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>발주서 상세</title>

    <link rel="stylesheet"
          th:href="@{/css/operation/purchaseorder.css}">
</head>

<body>
<main class="purchase-order-page purchase-order-detail-page">

    <section class="purchase-order-header">
        <div>
            <span class="page-category">매장 운영 관리</span>
            <h1>발주서 상세</h1>
            <p>발주서 정보와 발주 품목을 확인하고 관리합니다.</p>
        </div>

        <div class="purchase-order-header-actions">
            <a class="secondary-button"
               th:href="@{/admin/purchaseorder}">
                목록으로
            </a>
        </div>
    </section>

    <!-- 등록 완료 메시지 표시 -->
    <div class="message"
         th:if="${message != null}"
         th:text="${message}">
    </div>

    <!-- 발주서 기본 정보 -->
    <section class="detail-card">
        <div class="section-title">
            <h2>발주 정보</h2>
        </div>

        <dl class="detail-grid">
            <div>
                <dt>발주서 번호</dt>
                <dd th:text="${order.purchaseOrderNo}">1</dd>
            </div>

            <div>
                <dt>공급업체</dt>
                <dd th:text="${order.supplierName}">공급업체명</dd>
            </div>

            <div>
                <dt>발주 상태</dt>
                <dd>
                    <span class="status-badge"
                          th:text="${order.orderStatus == 'REQUESTED' ? '발주 요청' :
                                   order.orderStatus == 'ORDERED' ? '발주 완료' :
                                   order.orderStatus == 'RECEIVED' ? '입고 완료' :
                                   order.orderStatus == 'CANCELED' ? '발주 취소' :
                                   order.orderStatus}">
                        발주 요청
                    </span>
                </dd>
            </div>

            <div>
                <dt>발주일</dt>
                <dd th:text="${#temporals.format(
                        order.orderDate, 'yyyy-MM-dd HH:mm'
                )}">
                    2026-08-27 10:00
                </dd>
            </div>

            <div>
                <dt>입고 예정일</dt>
                <dd th:text="${order.expectedDate != null
                        ? #temporals.format(order.expectedDate, 'yyyy-MM-dd')
                        : '-'}">
                    -
                </dd>
            </div>

            <div>
                <dt>총 발주 금액</dt>
                <dd th:text="${#numbers.formatInteger(
                        order.totalAmount, 1, 'COMMA'
                ) + '원'}">
                    0원
                </dd>
            </div>

            <div class="detail-wide">
                <dt>메모</dt>
                <dd th:text="${order.memo != null and !order.memo.isBlank()
                        ? order.memo : '-'}">
                    -
                </dd>
            </div>
        </dl>
    </section>

    <!-- 발주 품목 추가 -->
    <section class="detail-card">
        <div class="section-title">
            <h2>발주 품목 추가</h2>
            <p>등록된 자재에서 발주할 품목을 선택합니다.</p>
        </div>

        <form class="item-form"
              th:action="@{/admin/purchaseorder/{no}/items(
                    no=${order.purchaseOrderNo}
              )}"
              th:object="${purchaseOrderItemRequest}"
              method="post">

            <div class="form-field material-field">
                <label for="materialNo">자재</label>

                <select id="materialNo"
                        th:field="*{materialNo}">
                    <option value="">자재를 선택해 주세요.</option>
                    <option th:each="material : ${materials}"
                            th:value="${material.materialNo}"
                            th:text="${material.materialName
                                    + ' (' + material.unitCode + ')'}">
                        자재명
                    </option>
                </select>

                <small class="field-error"
                       th:if="${#fields.hasErrors('materialNo')}"
                       th:errors="*{materialNo}">
                    자재 오류
                </small>
            </div>

            <div class="form-field">
                <label for="orderQuantity">발주 수량</label>

                <input id="orderQuantity"
                       type="number"
                       min="0.01"
                       step="0.01"
                       th:field="*{orderQuantity}"
                       placeholder="수량 입력">

                <small class="field-error"
                       th:if="${#fields.hasErrors('orderQuantity')}"
                       th:errors="*{orderQuantity}">
                    수량 오류
                </small>
            </div>

            <div class="form-field">
                <label for="unitPrice">구매 가격</label>

                <input id="unitPrice"
                       type="number"
                       min="0"
                       step="1"
                       th:field="*{unitPrice}"
                       placeholder="가격 입력">

                <small class="field-error"
                       th:if="${#fields.hasErrors('unitPrice')}"
                       th:errors="*{unitPrice}">
                    가격 오류
                </small>
            </div>

            <button class="primary-button item-add-button"
                    type="submit">
                품목 추가
            </button>
        </form>
    </section>

    <!-- 등록된 발주 품목 목록 -->
    <section class="detail-card">
        <div class="section-title">
            <h2>발주 품목</h2>
        </div>

        <div class="item-table-wrap">
            <table class="item-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>자재명</th>
                    <th>발주 수량</th>
                    <th>입고 수량</th>
                    <th>구매 가격</th>
                    <th>품목 금액</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item, itemStat : ${items}">
                    <td th:text="${itemStat.count}">1</td>
                    <td th:text="${item.materialName}">자재명</td>
                    <td th:text="${#numbers.formatDecimal(
                            item.orderQuantity, 1, 2
                    ) + ' ' + item.unitCode}">
                        0.00개
                    </td>
                    <td th:text="${#numbers.formatDecimal(
                            item.receivedQuantity, 1, 2
                    ) + ' ' + item.unitCode}">
                        0.00개
                    </td>
                    <td th:text="${#numbers.formatInteger(
                            item.unitPrice, 1, 'COMMA'
                    ) + '원'}">
                        0원
                    </td>
                    <td th:text="${#numbers.formatInteger(
                            item.itemAmount, 1, 'COMMA'
                    ) + '원'}">
                        0원
                    </td>
                </tr>

                <!-- 등록된 발주 품목이 없을 때 표시 -->
                <tr th:if="${#lists.isEmpty(items)}">
                    <td class="empty-message" colspan="6">
                        등록된 발주 품목이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
