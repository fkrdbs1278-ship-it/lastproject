<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>발주 관리</title>

    <!-- 발주 관리 화면 전용 CSS 연결 -->
    <link rel="stylesheet"
          th:href="@{/css/operation/purchaseorder.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin/dashboard-sidebar.css}">
</head>

<body>
<div class="purchaseorder-admin-layout">

    <!-- 관리자 공통 사이드바 -->
    <aside th:replace="~{admin/dashboard-sidebar :: sidebar('material')}"></aside>

    <div class="purchaseorder-admin-content">
        <main class="purchaseorder-page">

            <!-- 발주 관리 화면 제목과 상단 버튼 -->
            <section class="purchaseorder-header">
                <div>
                    <h1>발주 관리</h1>
                    <p>업체별 발주서와 입고 상태를 관리합니다.</p>
                </div>

                <div class="header-actions">
                    <!-- 자재 관리 화면 이동 -->
                    <a class="sub-button"
                       th:href="@{/admin/material}">
                        자재 관리
                    </a>

                    <!-- 발주서 등록 화면 이동 -->
                    <a class="primary-button"
                       th:href="@{/admin/purchaseorder/new}">
                        발주서 등록
                    </a>
                </div>
            </section>

            <!-- 발주서 등록 완료 메시지 -->
            <div class="message"
                 th:if="${message != null}"
                 th:text="${message}">
            </div>

            <!-- 업체명 검색과 발주 상태 필터 -->
            <section class="purchaseorder-filter">

                <!-- 업체명 검색 -->
                <form class="search-form"
                      th:action="@{/admin/purchaseorder}"
                      method="get">

                    <!-- 현재 선택한 발주 상태 유지 -->
                    <input type="hidden"
                           name="orderStatus"
                           th:value="${orderStatus}">

                    <input type="text"
                           name="supplierName"
                           th:value="${supplierName}"
                           placeholder="업체명을 입력해 주세요.">

                    <button type="submit">검색</button>
                </form>

                <!-- 발주 상태 선택 -->
                <nav class="filter-buttons">

                    <!-- 전체 발주서 조회 -->
                    <a th:href="@{/admin/purchaseorder}"
                       th:classappend="${orderStatus == null
                       or #strings.isEmpty(orderStatus)}
                       ? 'active'">
                        전체
                    </a>

                    <!-- 발주 요청 상태 조회 -->
                    <a th:href="@{/admin/purchaseorder(
                    orderStatus='REQUESTED'
               )}"
                       th:classappend="${orderStatus == 'REQUESTED'}
                       ? 'active'">
                        발주 요청
                    </a>

                    <!-- 발주 완료 상태 조회 -->
                    <a th:href="@{/admin/purchaseorder(
                    orderStatus='ORDERED'
               )}"
                       th:classappend="${orderStatus == 'ORDERED'}
                       ? 'active'">
                        발주 완료
                    </a>

                    <!-- 입고 완료 상태 조회 -->
                    <a th:href="@{/admin/purchaseorder(
                    orderStatus='RECEIVED'
               )}"
                       th:classappend="${orderStatus == 'RECEIVED'}
                       ? 'active'">
                        입고 완료
                    </a>

                    <!-- 발주 취소 상태 조회 -->
                    <a th:href="@{/admin/purchaseorder(
                    orderStatus='CANCELED'
               )}"
                       th:classappend="${orderStatus == 'CANCELED'}
                       ? 'active'">
                        발주 취소
                    </a>
                </nav>
            </section>

            <!-- 발주서 목록 테이블 -->
            <section class="purchaseorder-table-wrap">
                <table class="purchaseorder-table">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>업체명</th>
                        <th>발주 상태</th>
                        <th>발주일</th>
                        <th>입고 예정일</th>
                        <th>실제 입고일</th>
                        <th>총금액</th>
                        <th>메모</th>
                        <th>관리</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- 현재 페이지의 발주서 목록 반복 출력 -->
                    <tr th:each="order : ${orders}">

                        <!-- 발주서 번호 -->
                        <td th:text="${order.purchaseOrderNo}">
                            1
                        </td>

                        <!-- 업체 이름과 상세 화면 링크 -->
                        <td>
                            <a class="supplier-name"
                               th:href="@{/admin/purchaseorder/{no}(
                            no=${order.purchaseOrderNo}
                       )}"
                               th:text="${order.supplierName}">
                                업체명
                            </a>
                        </td>

                        <!-- 발주 상태 -->
                        <td>
                    <span class="order-status-badge"
                          th:classappend="${#strings.toLowerCase(
                                  order.orderStatus
                          )}"
                          th:text="${order.orderStatusName}">
                        발주 요청
                    </span>
                        </td>

                        <!-- 발주 날짜 -->
                        <td th:text="${#temporals.format(
                        order.orderDate,
                        'yyyy-MM-dd HH:mm'
                )}">
                            2026-08-26 15:30
                        </td>

                        <!-- 입고 예정일 -->
                        <td th:text="${order.expectedDate != null
                        ? #temporals.format(
                                order.expectedDate,
                                'yyyy-MM-dd'
                          )
                        : '-'}">
                            -
                        </td>

                        <!-- 실제 입고일 -->
                        <td th:text="${order.receivedDate != null
                        ? #temporals.format(
                                order.receivedDate,
                                'yyyy-MM-dd HH:mm'
                          )
                        : '-'}">
                            -
                        </td>

                        <!-- 발주 총금액 -->
                        <td th:text="${#numbers.formatInteger(
                        order.totalAmount,
                        1,
                        'COMMA'
                ) + '원'}">
                            0원
                        </td>

                        <!-- 발주 메모 -->
                        <td class="memo-cell"
                            th:text="${order.memo != null
                            and !#strings.isEmpty(order.memo)
                            ? order.memo
                            : '-'}">
                            -
                        </td>

                        <!-- 상세 화면 이동 -->
                        <td>
                            <a class="detail-button"
                               th:href="@{/admin/purchaseorder/{no}(
                            no=${order.purchaseOrderNo}
                       )}">
                                상세
                            </a>
                        </td>
                    </tr>

                    <!-- 조회된 발주서가 없을 때 표시 -->
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td class="empty-message" colspan="9">
                            조회된 발주서가 없습니다.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </section>

            <!-- 발주서 목록 페이지 번호 -->
            <nav class="pagination"
                 th:if="${orderPage.totalPages > 0}"
                 aria-label="발주서 페이지 이동">

                <!-- 이전 페이지 -->
                <a class="page-button"
                   th:if="${orderPage.hasPrevious()}"
                   th:href="@{/admin/purchaseorder(
                page=${orderPage.number - 1},
                orderStatus=${orderStatus},
                supplierName=${supplierName}
           )}">
                    &lt;
                </a>

                <!-- 첫 페이지에서는 이전 버튼 비활성화 -->
                <span class="page-button disabled"
                      th:unless="${orderPage.hasPrevious()}">
            &lt;
        </span>

                <!-- 페이지 번호 -->
                <a class="page-button"
                   th:each="pageNumber : ${#numbers.sequence(
                    0,
                    orderPage.totalPages - 1
           )}"
                   th:classappend="${pageNumber == orderPage.number}
                    ? 'active'"
                   th:href="@{/admin/purchaseorder(
                page=${pageNumber},
                orderStatus=${orderStatus},
                supplierName=${supplierName}
           )}"
                   th:text="${pageNumber + 1}">
                    1
                </a>

                <!-- 다음 페이지 -->
                <a class="page-button"
                   th:if="${orderPage.hasNext()}"
                   th:href="@{/admin/purchaseorder(
                page=${orderPage.number + 1},
                orderStatus=${orderStatus},
                supplierName=${supplierName}
           )}">
                    &gt;
                </a>

                <!-- 마지막 페이지에서는 다음 버튼 비활성화 -->
                <span class="page-button disabled"
                      th:unless="${orderPage.hasNext()}">
            &gt;
        </span>
            </nav>

        </main>
    </div>
</div>
</body>
</html>
