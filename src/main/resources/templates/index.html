<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SALON CRM</title>


    <link
            rel="stylesheet"
            th:href="@{/css/common.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/layout/header.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/layout/footer.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/home.css}"
    >

</head>

<body>


<!-- Header -->

<header th:replace="~{layout/header :: header}">
</header>


<!-- Main -->

<main>


    <!-- Hero -->

    <section class="hero">

        <div class="hero-inner">

            <h1 class="hero-title">

                나에게 어울리는 스타일을
                찾아보세요.

            </h1>


            <p class="hero-description">

                원하는 시술과 헤어스타일을 확인하고
                편리하게 예약 서비스를 이용해보세요.

            </p>


            <div class="hero-actions">

                <a
                        th:href="@{/services}"
                        class="hero-button"
                >

                    시술 메뉴 보기

                </a>


                <a
                        th:href="@{/hairstyles}"
                        class="hero-button secondary"
                >

                    헤어스타일 보기

                </a>

            </div>

        </div>

    </section>


    <!-- 주요 기능 -->

    <section class="feature-section">

        <h2 class="section-title">
            서비스 안내
        </h2>


        <div class="feature-grid">


            <!-- 시술 메뉴 -->

            <div class="feature-card">

                <h3>
                    시술 메뉴
                </h3>

                <p>
                    커트, 펌, 염색, 클리닉 등
                    다양한 시술 메뉴와 가격을 확인할 수 있습니다.
                </p>

            </div>


            <!-- 헤어스타일 -->

            <div class="feature-card">

                <h3>
                    헤어스타일
                </h3>

                <p>
                    다양한 헤어스타일 이미지를 확인하고
                    원하는 스타일을 찾아볼 수 있습니다.
                </p>

            </div>


            <!-- 마이페이지 -->

            <div class="feature-card">

                <h3>
                    마이페이지
                </h3>

                <p>
                    예약, 결제, 쿠폰 및 리뷰 내역을
                    한 곳에서 확인할 수 있습니다.
                </p>

            </div>

        </div>

    </section>


</main>


<!-- Footer -->

<footer th:replace="~{layout/footer :: footer}">
</footer>


</body>

</html>
