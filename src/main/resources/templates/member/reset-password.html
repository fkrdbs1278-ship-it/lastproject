<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >


    <title>비밀번호 찾기 | SALON CRM</title>


    <!-- CSRF -->

    <meta
            name="_csrf"
            th:content="${_csrf.token}"
    >

    <meta
            name="_csrf_header"
            th:content="${_csrf.headerName}"
    >


    <!-- 공통 CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/common.css}"
    >


    <!-- 비밀번호 재설정 CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/member/reset-password.css}"
    >

</head>


<body>


<main class="recovery-page">

    <div class="recovery-container">


        <!-- Logo -->

        <div class="auth-logo-area">

            <a
                    th:href="@{/}"
                    class="auth-logo"
            >
                SALON CRM
            </a>

        </div>


        <!-- Card -->

        <section class="recovery-card">


            <h1 class="recovery-title">
                비밀번호 찾기
            </h1>


            <p class="recovery-description">
                회원정보와 휴대전화 인증 후
                새 비밀번호를 설정할 수 있습니다.
            </p>


            <!-- 아이디 -->

            <div class="form-group">

                <label for="resetMemberId">
                    아이디
                </label>


                <input
                        type="text"
                        id="resetMemberId"
                        placeholder="아이디를 입력해주세요."
                        autocomplete="username"
                >

            </div>


            <!-- 전화번호 -->

            <div class="form-group">

                <label for="resetPhone">
                    휴대전화번호
                </label>


                <div class="verification-row">

                    <input
                            type="tel"
                            id="resetPhone"
                            placeholder="010-1234-5678"
                            inputmode="numeric"
                            autocomplete="tel"
                            maxlength="13"
                    >


                    <button
                            type="button"
                            id="resetSendButton"
                            class="verification-button"
                    >
                        인증번호 받기
                    </button>

                </div>


                <p class="field-help">
                    숫자만 입력해도 자동으로 하이픈(-)이 추가됩니다.
                </p>


                <p
                        id="resetSendMessage"
                        class="verification-message"
                        aria-live="polite"
                ></p>

            </div>


            <!-- 인증번호 -->

            <div
                    class="form-group"
                    id="resetCodeGroup"
                    hidden
            >

                <label for="resetCode">
                    인증번호
                </label>


                <div class="verification-row">

                    <input
                            type="text"
                            id="resetCode"
                            placeholder="6자리 인증번호"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                    >


                    <button
                            type="button"
                            id="resetVerifyButton"
                            class="verification-button"
                    >
                        인증 확인
                    </button>

                </div>


                <div class="verification-status">

                    <span
                            id="resetTimer"
                            class="verification-timer"
                    ></span>


                    <span
                            id="resetVerifyMessage"
                            class="verification-message"
                            aria-live="polite"
                    ></span>

                </div>

            </div>


            <!-- 새 비밀번호 영역 -->

            <div
                    id="newPasswordArea"
                    hidden
            >


                <div class="form-group">

                    <label for="newPassword">
                        새 비밀번호
                    </label>


                    <div class="password-input-wrap">

                        <input
                                type="password"
                                id="newPassword"
                                placeholder="새 비밀번호를 입력해주세요."
                                autocomplete="new-password"
                                minlength="8"
                                maxlength="20"
                        >


                        <button
                                type="button"
                                id="newPasswordToggle"
                                class="password-toggle"
                        >
                            보기
                        </button>

                    </div>


                    <div class="password-rules">

                        <p
                                id="resetRuleLength"
                                class="password-rule"
                        >
                            ✓ 8자 이상 20자 이하
                        </p>

                        <p
                                id="resetRuleUppercase"
                                class="password-rule"
                        >
                            ✓ 영문 대문자 포함
                        </p>

                        <p
                                id="resetRuleLowercase"
                                class="password-rule"
                        >
                            ✓ 영문 소문자 포함
                        </p>

                        <p
                                id="resetRuleNumber"
                                class="password-rule"
                        >
                            ✓ 숫자 포함
                        </p>

                        <p
                                id="resetRuleSpecial"
                                class="password-rule"
                        >
                            ✓ 특수문자 포함
                        </p>

                        <p
                                id="resetRuleNoSpace"
                                class="password-rule"
                        >
                            ✓ 공백 없음
                        </p>

                    </div>

                </div>


                <!-- 새 비밀번호 확인 -->

                <div class="form-group">

                    <label for="newPasswordCheck">
                        새 비밀번호 확인
                    </label>


                    <div class="password-input-wrap">

                        <input
                                type="password"
                                id="newPasswordCheck"
                                placeholder="새 비밀번호를 다시 입력해주세요."
                                autocomplete="new-password"
                                minlength="8"
                                maxlength="20"
                        >


                        <button
                                type="button"
                                id="newPasswordCheckToggle"
                                class="password-toggle"
                        >
                            보기
                        </button>

                    </div>


                    <p
                            id="passwordMatchMessage"
                            class="password-match-message"
                            aria-live="polite"
                    ></p>

                </div>


                <!-- 비밀번호 변경 버튼 -->

                <button
                        type="button"
                        id="resetPasswordButton"
                        class="recovery-submit-button"
                        disabled
                >
                    비밀번호 변경
                </button>


                <p
                        id="resetResultMessage"
                        class="verification-message result-message"
                        aria-live="polite"
                ></p>

            </div>


            <!-- 하단 -->

            <div class="recovery-bottom">

                <a th:href="@{/member/login}">
                    로그인
                </a>


                <span>
                    |
                </span>


                <a th:href="@{/member/find-id}">
                    아이디 찾기
                </a>

            </div>


        </section>

    </div>

</main>


<script
        th:src="@{/js/member/reset-password.js}"
></script>


</body>

</html>
