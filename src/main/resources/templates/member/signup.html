<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>회원가입</title>
</head>

<body>

<h1>회원가입</h1>


<!-- 회원가입 성공 -->
<div th:if="${param.success}">
    <p>회원가입이 완료되었습니다.</p>
</div>


<form
        th:action="@{/member/signup}"
        th:object="${signupRequest}"
        method="post"
>

    <div>
        <label for="memberId">
            아이디
        </label>

        <input
                type="text"
                id="memberId"
                th:field="*{memberId}"
        >

        <p
                th:if="${#fields.hasErrors('memberId')}"
                th:errors="*{memberId}"
        ></p>
    </div>


    <div>
        <label for="password">
            비밀번호
        </label>

        <input
                type="password"
                id="password"
                th:field="*{password}"
        >

        <p
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}"
        ></p>
    </div>


    <div>
        <label for="passwordCheck">
            비밀번호 확인
        </label>

        <input
                type="password"
                id="passwordCheck"
                th:field="*{passwordCheck}"
        >

        <p
                th:if="${#fields.hasErrors('passwordCheck')}"
                th:errors="*{passwordCheck}"
        ></p>
    </div>


    <div>
        <label for="name">
            이름
        </label>

        <input
                type="text"
                id="name"
                th:field="*{name}"
        >

        <p
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
        ></p>
    </div>


    <div>
        <label for="nickname">
            닉네임
        </label>

        <input
                type="text"
                id="nickname"
                th:field="*{nickname}"
        >
    </div>


    <div>
        <label for="email">
            이메일
        </label>

        <input
                type="email"
                id="email"
                th:field="*{email}"
        >

        <p
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}"
        ></p>
    </div>


    <div>
        <label for="phone">
            전화번호
        </label>

        <input
                type="text"
                id="phone"
                th:field="*{phone}"
                placeholder="010-1234-5678"
        >

        <p
                th:if="${#fields.hasErrors('phone')}"
                th:errors="*{phone}"
        ></p>
    </div>


    <div>
        <label for="birthDate">
            생년월일
        </label>

        <input
                type="date"
                id="birthDate"
                th:field="*{birthDate}"
        >
    </div>


    <div>
        <span>성별</span>

        <label>
            <input
                    type="radio"
                    th:field="*{gender}"
                    value="M"
            >
            남성
        </label>

        <label>
            <input
                    type="radio"
                    th:field="*{gender}"
                    value="F"
            >
            여성
        </label>
    </div>


    <div>
        <label>
            <input
                    type="checkbox"
                    th:field="*{agreeTerms}"
            >
            이용약관에 동의합니다.
        </label>

        <p
                th:if="${#fields.hasErrors('agreeTerms')}"
                th:errors="*{agreeTerms}"
        ></p>
    </div>


    <div>
        <label>
            <input
                    type="checkbox"
                    th:field="*{agreePrivacy}"
            >
            개인정보 수집에 동의합니다.
        </label>

        <p
                th:if="${#fields.hasErrors('agreePrivacy')}"
                th:errors="*{agreePrivacy}"
        ></p>
    </div>


    <button type="submit">
        회원가입
    </button>

</form>

</body>
</html>
