<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="_csrf"
            th:content="${_csrf.token}"
    >

    <meta
            name="_csrf_header"
            th:content="${_csrf.headerName}"
    >

    <title>회원정보 수정 | SALON CRM</title>


    <!-- 공통 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/common.css}"
    >


    <!-- Header -->
    <link
            rel="stylesheet"
            th:href="@{/css/layout/header.css}"
    >


    <!-- Footer -->
    <link
            rel="stylesheet"
            th:href="@{/css/layout/footer.css}"
    >


    <!-- 회원정보 수정 -->
    <link
            rel="stylesheet"
            th:href="@{/css/member/edit.css}"
    >

</head>


<body>


<!-- Header -->

<header th:replace="~{layout/header :: header}">
</header>


<!-- Main -->

<main class="member-edit-page">

    <div class="member-edit-container">


        <!-- Page Title -->

        <div class="member-edit-header">

            <h1 class="member-edit-title">
                회원정보 수정
            </h1>

            <p class="member-edit-description">
                변경할 회원정보를 입력해주세요.
            </p>

        </div>


        <!-- Card -->

        <section class="member-edit-card">


            <!-- 수정 성공 메시지 -->

            <div
                    th:if="${param.updated}"
                    class="edit-message success"
            >
                회원정보가 수정되었습니다.
            </div>


            <!-- Edit Form -->

            <form
                    th:action="@{/member/edit}"
                    th:object="${memberUpdateRequest}"
                    method="post"
                    class="member-edit-form"
            >


                <!-- CSRF -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <!-- 이름 -->

                <div class="form-group">

                    <label for="name">
                        이름
                    </label>

                    <input
                            type="text"
                            id="name"
                            th:field="*{name}"
                            placeholder="이름을 입력해주세요."
                    >

                    <p
                            class="field-error"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}"
                    >
                        이름 오류
                    </p>

                </div>


                <!-- 닉네임 -->

                <div class="form-group">

                    <label for="nickname">
                        닉네임
                    </label>

                    <input
                            type="text"
                            id="nickname"
                            th:field="*{nickname}"
                            placeholder="닉네임을 입력해주세요."
                    >

                    <p
                            class="field-error"
                            th:if="${#fields.hasErrors('nickname')}"
                            th:errors="*{nickname}"
                    >
                        닉네임 오류
                    </p>

                </div>


                <!-- 이메일 -->

                <div class="form-group">

                    <label for="email">
                        이메일
                    </label>

                    <input
                            type="email"
                            id="email"
                            th:field="*{email}"
                            placeholder="example@email.com"
                            maxlength="100"
                            autocomplete="email"
                    >

                    <p
                            th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 전화번호 -->

                <div class="form-group">

                    <label for="phone">
                        전화번호
                    </label>


                    <!-- 전화번호 입력 + 인증번호 받기 버튼 -->

                    <div class="phone-verification-row">

                        <input
                                type="tel"
                                id="phone"
                                th:field="*{phone}"
                                placeholder="010-1234-5678"
                                inputmode="numeric"
                                autocomplete="tel"
                                maxlength="13"
                        >


                        <button
                                type="button"
                                id="updatePhoneSendButton"
                                class="phone-verification-button"
                                hidden
                        >
                            인증번호 받기
                        </button>

                    </div>


                    <!-- 전화번호 설명 -->

                    <p class="field-help">
                        숫자만 입력해도 자동으로 하이픈(-)이 추가됩니다.
                        전화번호를 변경하는 경우 새 번호 인증이 필요합니다.
                    </p>


                    <!-- 전화번호 변경/인증 안내 메시지 -->

                    <p
                            id="updatePhoneChangeMessage"
                            class="phone-verification-message"
                            aria-live="polite"
                    ></p>


                    <!-- 기존 서버 Validation 오류 -->

                    <p
                            class="field-error"
                            th:if="${#fields.hasErrors('phone')}"
                            th:errors="*{phone}"
                    >
                        전화번호 오류
                    </p>

                </div>

                <!-- 변경 전화번호 인증 -->

                <div
                        class="form-group phone-code-group"
                        id="updatePhoneCodeGroup"
                        hidden
                >

                    <label for="updatePhoneCode">
                        인증번호
                    </label>


                    <div class="phone-verification-row">

                        <input
                                type="text"
                                id="updatePhoneCode"
                                placeholder="6자리 인증번호"
                                inputmode="numeric"
                                maxlength="6"
                                autocomplete="one-time-code"
                        >


                        <button
                                type="button"
                                id="updatePhoneVerifyButton"
                                class="phone-verification-button"
                        >
                            인증 확인
                        </button>

                    </div>


                    <div class="phone-verification-status">

                        <span
                                id="updatePhoneTimer"
                                class="phone-verification-timer"
                        ></span>


                        <span
                                id="updatePhoneVerifyMessage"
                                class="phone-verification-message"
                                aria-live="polite"
                        ></span>

                    </div>

                </div>




                <!-- 생년월일 -->

                <div class="form-group">

                    <label for="birthDate">
                        생년월일
                    </label>

                    <input
                            type="date"
                            id="birthDate"
                            th:field="*{birthDate}"
                            min="1900-01-01"
                            autocomplete="bday"
                    >

                    <p
                            class="field-error"
                            th:if="${#fields.hasErrors('birthDate')}"
                            th:errors="*{birthDate}"
                    >
                        생년월일 오류
                    </p>

                </div>


                <!-- 성별 -->

                <div class="form-group">

                    <label>
                        성별
                    </label>


                    <div class="gender-group">

                        <label class="gender-option">

                            <input
                                    type="radio"
                                    th:field="*{gender}"
                                    value="M"
                            >

                            남성

                        </label>


                        <label class="gender-option">

                            <input
                                    type="radio"
                                    th:field="*{gender}"
                                    value="F"
                            >

                            여성

                        </label>

                    </div>

                </div>


                <!-- Current Password -->

                <div class="password-confirm-area">

                    <p class="password-guide">
                        회원정보를 수정하려면 현재 비밀번호를 입력해주세요.
                    </p>


                    <div class="form-group">

                        <label for="currentPassword">
                            현재 비밀번호
                        </label>

                        <input
                                type="password"
                                id="currentPassword"
                                th:field="*{currentPassword}"
                                placeholder="현재 비밀번호를 입력해주세요."
                                autocomplete="current-password"
                        >

                        <p
                                class="field-error"
                                th:if="${#fields.hasErrors('currentPassword')}"
                                th:errors="*{currentPassword}"
                        >
                            비밀번호 오류
                        </p>

                    </div>

                </div>


                <!-- 수정 버튼 -->

                <button
                        type="submit"
                        class="edit-button"
                >
                    수정하기
                </button>

            </form>


            <!--  Withdraw -->

            <div class="withdraw-area">

                <a
                        th:href="@{/member/withdraw}"
                        class="withdraw-link"
                >
                    회원 탈퇴
                </a>

            </div>


        </section>

    </div>

</main>


<!-- Footer -->

<footer th:replace="~{layout/footer :: footer}">
</footer>


<script th:src="@{/js/member/edit.js}"></script>

</body>

</html>
