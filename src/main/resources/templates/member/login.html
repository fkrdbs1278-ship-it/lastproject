<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>로그인</title>

</head>

<body>


<h1>로그인</h1>


<!-- ==============================
     회원가입 성공
============================== -->

<div th:if="${param.signup}">

    <p>
        회원가입이 완료되었습니다.
        로그인해주세요.
    </p>

</div>


<!-- ==============================
     로그인 실패
============================== -->

<div th:if="${param.error}">

    <p>
        아이디 또는 비밀번호를 확인해주세요.
    </p>

</div>


<!-- ==============================
     로그아웃 완료
============================== -->

<div th:if="${param.logout}">

    <p>
        로그아웃되었습니다.
    </p>

</div>


<!-- 회원탈퇴 완료 -->

<div th:if="${param.withdraw}">

    <p>
        회원탈퇴가 완료되었습니다.
    </p>

</div>

<!-- ==============================
     로그인 Form
============================== -->

<form
        th:action="@{/member/login/process}"
        method="post"
>

    <!-- 아이디 -->

    <div>

        <label for="memberId">
            아이디
        </label>

        <input
                type="text"
                id="memberId"
                name="memberId"
                autocomplete="username"
                required
        >

    </div>


    <!-- 비밀번호 -->

    <div>

        <label for="password">
            비밀번호
        </label>

        <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
        >

    </div>


    <!-- CSRF -->

    <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
    >


    <!-- 로그인 -->

    <button type="submit">
        로그인
    </button>

</form>


<!-- ==============================
     회원가입 이동
============================== -->

<div>

    <p>
        아직 회원이 아니신가요?
    </p>

    <a th:href="@{/member/signup}">
        회원가입
    </a>

</div>


</body>

</html>
