<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>로그인 | SALON CRM</title>


    <!-- 공통 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/common.css}"
    >


    <!-- 로그인 전용 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/member/login.css}"
    >

</head>


<body>


<main class="login-page">

    <div class="login-container">


        <!--  Logo
             클릭하면 메인 페이지로 이동 -->

        <div class="auth-logo-area">

            <a
                    th:href="@{/}"
                    class="auth-logo"
            >
                SALON CRM
            </a>

        </div>


        <!-- Login Card -->

        <section class="login-card">


            <!-- 로그인이라는 큰 제목은 사용하지 않음 -->

            <p class="login-description">
                회원 정보를 입력해주세요.
            </p>


            <!-- 회원가입 성공 -->

            <div
                    th:if="${param.signup}"
                    class="login-message success"
            >
                회원가입이 완료되었습니다.
                로그인해주세요.
            </div>


            <!-- 로그인 실패 -->

            <div
                    th:if="${param.error}"
                    class="login-message error"
            >
                아이디 또는 비밀번호를 확인해주세요.
            </div>


            <!--  로그아웃 성공 -->

            <div
                    th:if="${param.logout}"
                    class="login-message success"
            >
                로그아웃되었습니다.
            </div>


            <!-- 회원탈퇴 성공 -->

            <div
                    th:if="${param.withdraw}"
                    class="login-message success"
            >
                회원탈퇴가 완료되었습니다.
            </div>


            <!-- Login Form -->

            <form
                    id="loginForm"
                    th:action="@{/member/login/process}"
                    method="post"
                    class="login-form"
            >


                <!-- CSRF -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <!-- 아이디 -->

                <div class="form-group">

                    <label for="memberId">
                        아이디
                    </label>

                    <input
                            type="text"
                            id="memberId"
                            name="memberId"
                            placeholder="아이디를 입력해주세요."
                            autocomplete="username"
                            required
                    >

                </div>


                <!-- 비밀번호 -->

                <div class="form-group">

                    <label for="loginPassword">
                        비밀번호
                    </label>


                    <!-- 비밀번호 입력 + 보기/숨기기 버튼 -->

                    <div class="password-input-wrap">

                        <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="비밀번호를 입력해주세요."
                                autocomplete="current-password"
                                required
                        >


                        <button
                                type="button"
                                id="passwordToggle"
                                class="password-toggle"
                                aria-label="비밀번호 표시"
                        >
                            보기
                        </button>

                    </div>


                    <!-- Caps Lock 안내 -->

                    <p
                            id="capsLockMessage"
                            class="caps-lock-message"
                            aria-live="polite"
                    ></p>

                </div>


                <!-- 로그인 버튼 -->

                <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                >
                    로그인
                </button>

            </form>


            <!-- =====================================
                 Signup Link
            ====================================== -->

            <div class="login-bottom">

                <span>
                    아직 회원이 아니신가요?
                </span>

                <a
                        th:href="@{/member/signup}"
                        class="signup-link"
                >
                    회원가입
                </a>

            </div>


        </section>

    </div>

</main>

<script th:src="@{/js/member/login.js}"></script>

</body>

</html>
