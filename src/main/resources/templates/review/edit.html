<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>리뷰 수정 | SALON CRM</title>


    <link
            rel="stylesheet"
            th:href="@{/css/common.css}"
    >

    <!-- 헤더 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/layout/header.css}"
    >

    <!-- 푸터 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/layout/footer.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/review/review.css}"
    >

</head>


<body>


<header th:replace="~{layout/header :: header}">
</header>


<main class="review-page">

    <div class="review-form-container">


        <section class="review-form-card">


            <h1 class="review-form-title">
                리뷰 수정
            </h1>


            <form
                    th:action="@{/reviews/{no}/edit(no=${reviewNo})}"
                    th:object="${reviewUpdateRequest}"
                    method="post"
                    class="review-form"
            >


                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <!-- 평점 -->

                <div class="review-form-group">

                    <label>
                        평점
                    </label>


                    <div class="rating-options">

                        <div
                                class="rating-option"
                                th:each="score : ${#numbers.sequence(1, 5)}"
                        >

                            <input
                                    type="radio"
                                    th:field="*{rating}"
                                    th:value="${score}"
                                    th:id="${'rating' + score}"
                            >

                            <label
                                    th:for="${'rating' + score}"
                                    th:text="${'★ ' + score}"
                            >
                                ★ 1
                            </label>

                        </div>

                    </div>


                    <p
                            th:if="${#fields.hasErrors('rating')}"
                            th:errors="*{rating}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 제목 -->

                <div class="review-form-group">

                    <label for="title">
                        제목
                    </label>

                    <input
                            type="text"
                            id="title"
                            th:field="*{title}"
                            maxlength="200"
                    >

                    <p
                            th:if="${#fields.hasErrors('title')}"
                            th:errors="*{title}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 내용 -->

                <div class="review-form-group">

                    <label for="content">
                        내용
                    </label>

                    <textarea
                            id="content"
                            th:field="*{content}"
                            maxlength="2000"
                            rows="8"
                    ></textarea>

                    <p
                            th:if="${#fields.hasErrors('content')}"
                            th:errors="*{content}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 버튼 -->

                <div class="review-form-actions">

                    <a
                            th:href="@{/reviews/{no}(no=${reviewNo})}"
                            class="review-cancel-button"
                    >
                        취소
                    </a>


                    <button
                            type="submit"
                            class="review-submit-button"
                    >
                        수정 완료
                    </button>

                </div>


            </form>


        </section>

    </div>

</main>


<footer th:replace="~{layout/footer :: footer}">
</footer>


</body>

</html>
