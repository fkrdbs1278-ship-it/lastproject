<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>리뷰 작성 | SALON CRM</title>


    <link
            rel="stylesheet"
            th:href="@{/css/common.css}"
    >

    <!-- 헤더 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/layout/header.css}"
    >

    <!-- 푸터 CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/layout/footer.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/review/review.css}"
    >

</head>


<body>


<header th:replace="~{layout/header :: header}">
</header>


<main class="review-page">

    <div class="review-form-container">


        <section class="review-form-card">


            <h1 class="review-form-title">
                리뷰 작성
            </h1>


            <p class="review-form-description">
                서비스 이용 경험을 남겨주세요.
            </p>


            <form
                    th:action="@{/reviews/write}"
                    th:object="${reviewCreateRequest}"
                    method="post"
                    class="review-form"
            >


                <!-- CSRF -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <!-- 나중에 예약 연동용 -->

                <input
                        type="hidden"
                        th:field="*{reservationNo}"
                >


                <!-- 평점 -->

                <div class="review-form-group">

                    <label>
                        평점
                    </label>


                    <div class="rating-options">


                        <div class="rating-option">

                            <input
                                    type="radio"
                                    th:field="*{rating}"
                                    value="1"
                                    id="rating1"
                            >

                            <label for="rating1">
                                ★ 1
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                    type="radio"
                                    th:field="*{rating}"
                                    value="2"
                                    id="rating2"
                            >

                            <label for="rating2">
                                ★ 2
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                    type="radio"
                                    th:field="*{rating}"
                                    value="3"
                                    id="rating3"
                            >

                            <label for="rating3">
                                ★ 3
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                    type="radio"
                                    th:field="*{rating}"
                                    value="4"
                                    id="rating4"
                            >

                            <label for="rating4">
                                ★ 4
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                    type="radio"
                                    th:field="*{rating}"
                                    value="5"
                                    id="rating5"
                            >

                            <label for="rating5">
                                ★ 5
                            </label>

                        </div>


                    </div>


                    <p
                            th:if="${#fields.hasErrors('rating')}"
                            th:errors="*{rating}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 제목 -->

                <div class="review-form-group">

                    <label for="title">
                        제목
                    </label>

                    <input
                            type="text"
                            id="title"
                            th:field="*{title}"
                            maxlength="200"
                            placeholder="제목을 입력해주세요. (선택)"
                    >

                    <p
                            th:if="${#fields.hasErrors('title')}"
                            th:errors="*{title}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 내용 -->

                <div class="review-form-group">

                    <label for="content">
                        내용
                    </label>

                    <textarea
                            id="content"
                            th:field="*{content}"
                            maxlength="2000"
                            rows="8"
                            placeholder="리뷰 내용을 입력해주세요."
                    ></textarea>

                    <p
                            th:if="${#fields.hasErrors('content')}"
                            th:errors="*{content}"
                            class="field-error"
                    ></p>

                </div>


                <!-- 버튼 -->

                <div class="review-form-actions">

                    <a
                            th:href="@{/reviews}"
                            class="review-cancel-button"
                    >
                        취소
                    </a>


                    <button
                            type="submit"
                            class="review-submit-button"
                    >
                        리뷰 등록
                    </button>

                </div>


            </form>


        </section>

    </div>

</main>


<footer th:replace="~{layout/footer :: footer}">
</footer>


</body>

</html>
