<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공급업체 발주 확인</title>

    <!-- 테스트 공급업체 화면 전용 CSS 연결 -->
    <link rel="stylesheet"
          th:href="@{/css/operation/testcompany.css}">
</head>

<body>
<main class="test-company-page">

    <!-- 테스트 공급업체 화면 제목 -->
    <section class="test-company-header">
        <div>
            <p class="page-category">외부 공급업체 테스트</p>
            <h1>발주 요청 확인</h1>
            <p>
                미용실에서 요청한 발주서와 처리 상태를 확인합니다.
            </p>
        </div>

        <!-- 관리자 발주 관리 화면 이동 -->
        <a class="secondary-button"
           th:href="@{/admin/purchaseorder}">
            관리자 화면
        </a>
    </section>

    <!-- 상태 처리 완료 메시지 -->
    <div class="message"
         th:if="${message != null}"
         th:text="${message}">
    </div>

    <!-- 테스트 공급업체 안내 -->
    <section class="test-notice">
        <strong>테스트 화면</strong>

        <p>
            외부 공급업체의 발주 확인과 출고 과정을
            시뮬레이션하기 위한 임시 화면입니다.
        </p>
    </section>

    <!-- 미용실에서 등록한 발주서 목록 -->
    <section class="order-table-card">
        <div class="section-title">
            <h2>발주서 목록</h2>
            <p>발주서를 선택하면 요청 품목을 확인할 수 있습니다.</p>
        </div>

        <div class="table-wrap">
            <table class="order-table">
                <thead>
                <tr>
                    <th>발주서 번호</th>
                    <th>공급업체</th>
                    <th>발주일</th>
                    <th>입고 예정일</th>
                    <th>총금액</th>
                    <th>처리 상태</th>
                    <th>관리</th>
                </tr>
                </thead>

                <tbody>
                <!-- 등록된 발주서 반복 출력 -->
                <tr th:each="order : ${orders}">
                    <td th:text="${order.purchaseOrderNo}">
                        1
                    </td>

                    <td th:text="${order.supplierName}">
                        공급업체명
                    </td>

                    <td th:text="${#temporals.format(
                            order.orderDate,
                            'yyyy-MM-dd HH:mm'
                    )}">
                        2026-08-28 10:00
                    </td>

                    <td th:text="${order.expectedDate != null
                            ? #temporals.format(
                                    order.expectedDate,
                                    'yyyy-MM-dd'
                              )
                            : '-'}">
                        -
                    </td>

                    <td th:text="${#numbers.formatInteger(
                            order.totalAmount,
                            1,
                            'COMMA'
                    ) + '원'}">
                        0원
                    </td>

                    <td>
                        <span class="status-badge"
                              th:classappend="${#strings.toLowerCase(
                                      order.orderStatus
                              )}"
                              th:text="${order.orderStatus == 'REQUESTED'
                                      ? '확인 대기'
                                      : order.orderStatus == 'ORDERED'
                                      ? '출고 완료'
                                      : order.orderStatus == 'RECEIVED'
                                      ? '입고 확인 완료'
                                      : order.orderStatus == 'CANCELED'
                                      ? '발주 거절'
                                      : order.orderStatus}">
                            확인 대기
                        </span>
                    </td>

                    <td>
                        <a class="detail-button"
                           th:href="@{/testcompany/purchaseorder/{no}(
                                no=${order.purchaseOrderNo}
                           )}">
                            상세 확인
                        </a>
                    </td>
                </tr>

                <!-- 등록된 발주서가 없을 때 표시 -->
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td class="empty-message"
                        colspan="7">
                        미용실에서 요청한 발주서가 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
