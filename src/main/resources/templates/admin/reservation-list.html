<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>예약 관리 | SALON ADMIN</title>

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <!-- 기존 예약 모달/폼 공통 스타일 -->
    <link rel="stylesheet"
          th:href="@{/css/reservation/reservation.css}">

    <!-- 관리자 공통 사이드바 / 대시보드 스타일 -->
    <link rel="stylesheet"
          th:href="@{/css/admin/dashboard-sidebar.css}">
    <link rel="stylesheet"
          th:href="@{/css/admin/dashboard.css}">

    <!-- 예약 관리 전용 관리자 스타일 -->
    <link rel="stylesheet"
          th:href="@{/css/admin/reservation-admin.css}">
</head>

<body>

<div class="admin-layout">

    <!-- dashboard와 동일한 고정 사이드바 -->
    <aside th:replace="~{admin/dashboard-sidebar :: sidebar('reservation')}"></aside>

    <!-- 오른쪽 콘텐츠만 변경 -->
    <main class="dashboard-content reservation-admin-content">

        <!-- 페이지 상단 -->
        <header class="dashboard-header">
            <div class="header-title">
                <p class="page-label">RESERVATION</p>
                <h1>예약 관리</h1>
                <p class="page-description">
                    예약 조회·상태 변경과 전화 예약, 영업 일정 관리를 한 곳에서 처리합니다.
                </p>
            </div>

            <a th:href="@{/admin/dashboard}"
               class="site-button">
                대시보드로 이동
                <span>↗</span>
            </a>
        </header>

        <!-- 예약 운영 기능
             dashboard 메인에 있던 2part 기능을 예약 관리 화면으로 이동 -->
        <section class="reservation-operation-grid"
                 aria-label="예약 운영 기능">

            <article class="reservation-operation-card active-card">
                <div class="operation-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                        <line x1="8" y1="3" x2="8" y2="7"></line>
                        <line x1="16" y1="3" x2="16" y2="7"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <div>
                    <strong>예약 관리</strong>
                    <span>전체 예약 조회·상태 변경</span>
                </div>
            </article>

            <button id="openPhoneReservation"
                    type="button"
                    class="reservation-operation-card operation-button">
                <div class="operation-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6.5 4.5H10L11.5 8L9.5 9.5C10.5 12 12 13.5 14.5 14.5L16 12.5L19.5 14V17.5C19.5 18.6 18.6 19.5 17.5 19.5C10.3 19.5 4.5 13.7 4.5 6.5C4.5 5.4 5.4 4.5 6.5 4.5Z"></path>
                    </svg>
                </div>
                <div>
                    <strong>전화 예약</strong>
                    <span>관리자 전화 예약 등록</span>
                </div>
            </button>

            <button id="openBusinessHours"
                    type="button"
                    class="reservation-operation-card operation-button">
                <div class="operation-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="8.5"></circle>
                        <path d="M12 7V12L15.5 14"></path>
                    </svg>
                </div>
                <div>
                    <strong>영업시간</strong>
                    <span>영업시간·정기휴무 관리</span>
                </div>
            </button>

            <button id="openHolidays"
                    type="button"
                    class="reservation-operation-card operation-button">
                <div class="operation-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                        <line x1="8" y1="3" x2="8" y2="7"></line>
                        <line x1="16" y1="3" x2="16" y2="7"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <path d="M8 15L10.5 17.5L16 12"></path>
                    </svg>
                </div>
                <div>
                    <strong>휴일 관리</strong>
                    <span>임시 휴일·휴가 등록</span>
                </div>
            </button>

            <button id="openAvailabilityBlocks"
                    type="button"
                    class="reservation-operation-card operation-button">
                <div class="operation-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3"></circle>
                        <path d="M6 20C6 16.5 8.4 14 12 14C15.6 14 18 16.5 18 20"></path>
                        <line x1="18" y1="5" x2="22" y2="9"></line>
                        <line x1="22" y1="5" x2="18" y2="9"></line>
                    </svg>
                </div>
                <div>
                    <strong>개인 일정</strong>
                    <span>예약 불가 시간 관리</span>
                </div>
            </button>

        </section>

        <!-- 검색 -->
        <section class="reservation-admin-panel">
            <div class="reservation-panel-heading">
                <div>
                    <p class="panel-label">SEARCH</p>
                    <h2>예약 검색</h2>
                </div>
            </div>

            <form id="searchForm"
                  class="search-grid reservation-search-grid">

                <label class="field reservation-no-field">
                    <span>예약번호</span>
                    <input id="reservationNoSearch"
                           type="number"
                           min="1"
                           inputmode="numeric"
                           placeholder="예: 367">
                </label>

                <label class="field">
                    <span>상태</span>
                    <select id="status">
                        <option value="">전체</option>
                        <option value="REQUESTED">신청</option>
                        <option value="CONFIRMED">확정</option>
                        <option value="COMPLETED">완료</option>
                        <option value="CANCELED">취소</option>
                        <option value="NO_SHOW">노쇼</option>
                    </select>
                </label>

                <label class="field">
                    <span>고객 유형</span>
                    <select id="customerType">
                        <option value="">전체</option>
                        <option value="MEMBER">회원</option>
                        <option value="GUEST">비회원</option>
                    </select>
                </label>

                <label class="field">
                    <span>이름</span>
                    <input id="guestName"
                           type="text"
                           maxlength="50"
                           placeholder="이름">
                </label>

                <label class="field">
                    <span>전화번호</span>
                    <input id="guestPhone"
                           type="tel"
                           maxlength="11"
                           inputmode="numeric"
                           autocomplete="tel"
                           placeholder="01012345678">
                </label>

                <label class="field date-field">
                    <span>시작일</span>
                    <input id="startFrom"
                           type="date">
                </label>

                <label class="field date-field">
                    <span>종료일</span>
                    <input id="startTo"
                           type="date">
                </label>

                <div class="search-actions reservation-search-actions">
                    <button class="primary-button"
                            type="submit">
                        검색
                    </button>
                    <button class="secondary-button"
                            id="resetSearch"
                            type="button">
                        초기화
                    </button>
                </div>

            </form>
        </section>

        <!-- 예약 목록 -->
        <section class="reservation-admin-panel reservation-list-panel">

            <div class="reservation-panel-heading">
                <div>
                    <p class="panel-label">RESERVATION LIST</p>
                    <h2>전체 예약 <span id="reservationResultCount" class="result-count-badge">0건</span></h2>
                    <p>
                        예약 상세에서 요청사항·스타일·참고 이미지를 확인할 수 있습니다.
                    </p>
                </div>
            </div>

            <div class="table-wrap">
                <table class="reservation-table">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>고객</th>
                        <th>시술</th>
                        <th>예약시간</th>
                        <th>상태</th>
                        <th>요청사항</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="reservationTableBody"></tbody>
                </table>
            </div>

            <div class="pagination">
                <button id="prevPage"
                        class="secondary-button"
                        type="button">
                    이전
                </button>

                <span id="pageInfo">1 / 1</span>

                <button id="nextPage"
                        class="secondary-button"
                        type="button">
                    다음
                </button>
            </div>

        </section>

    </main>
</div>

<!-- 기존 2part 상세 모달 -->
<div id="detailOverlay"
     class="detail-overlay hidden">
    <div class="detail-modal">
        <div class="section-title-row">
            <h2>예약 상세</h2>
            <button id="closeDetail"
                    type="button"
                    class="secondary-button">
                닫기
            </button>
        </div>
        <div id="detailContent"></div>
    </div>
</div>

<!-- 관리자 예약 취소 모달 -->
<div id="adminCancelOverlay"
     class="detail-overlay hidden">
    <div class="detail-modal admin-cancel-modal">
        <div class="section-title-row admin-cancel-modal-header">
            <div>
                <p class="admin-cancel-eyebrow">CANCEL RESERVATION</p>
                <h2>예약 취소</h2>
            </div>
            <button id="closeAdminCancel"
                    type="button"
                    class="secondary-button">
                닫기
            </button>
        </div>

        <p class="admin-cancel-description">
            고객 예약을 취소합니다. 취소 사유는 예약 이력에 저장됩니다.
        </p>

        <input id="adminCancelReservationNo"
               type="hidden">

        <label class="field admin-cancel-field">
            <span>관리자 취소 사유</span>
            <textarea id="adminCancelReason"
                      rows="4"
                      maxlength="200"
                      placeholder="예: 고객 요청으로 예약을 취소합니다."></textarea>
            <span class="admin-cancel-counter">
                <span id="adminCancelReasonCount">0</span>/200
            </span>
        </label>

        <div class="admin-cancel-actions">
            <button id="backAdminCancel"
                    type="button"
                    class="secondary-button">
                돌아가기
            </button>
            <button id="confirmAdminCancel"
                    type="button"
                    class="admin-cancel-confirm-button">
                예약 취소
            </button>
        </div>
    </div>
</div>

<!-- 기존 2part 운영 도구 모달 -->
<div id="adminToolOverlay"
     class="detail-overlay hidden">
    <div class="detail-modal admin-tool-modal">
        <div class="section-title-row">
            <h2 id="adminToolTitle">운영 도구</h2>
            <button id="closeAdminTool"
                    type="button"
                    class="secondary-button">
                닫기
            </button>
        </div>
        <div id="adminToolContent"></div>
    </div>
</div>

<div id="messageBox"
     class="message-box hidden"
     role="alert"></div>

<script th:src="@{/js/reservation/admin-reservations.js}"></script>

</body>
</html>
