spring:
  application:
    name: lastproject

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: orcltest
    password: 1234
#    driver-class-name: oracle.jdbc.OracleDriver
#    url: ${DB_URL}
#    username: ${DB_USERNAME}
#    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB


# P6Spy를 사용하는 경우
decorator:
  datasource:
    enabled: true

    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true


logging:
  level:
    root: info

    # 개발 중 SQL 확인용
    p6spy: info

    # 우리 프로젝트 코드
    com.example.lastproject: debug


file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}