spring:
  application:
    name: lastproject

  datasource:
#    driver-class-name: oracle.jdbc.OracleDriver
#    url: jdbc:oracle:thin:@localhost:1521:XE
#    username: orcltest
#    password: 1234
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    root: info
    com.young04.lastproject: debug

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  siteadmin-upload-dir: ${SITEADMIN_UPLOAD_DIR:siteadmin-upload}

# 예약 문자 알림
#
# =========================================================
# 공통 SMS 설정
#
# 개발 기본값:
# SMS_PROVIDER=log
#
# 실제 SOLAPI 발송:
# SMS_PROVIDER=solapi
# SOLAPI_API_KEY=...
# SOLAPI_API_SECRET=...
# SOLAPI_SENDER=SOLAPI에 등록된 발신번호
# =========================================================
sms:
  provider: ${SMS_PROVIDER:log}

  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
