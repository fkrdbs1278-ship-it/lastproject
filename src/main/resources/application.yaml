spring:
  application:
    name: lastproject
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update #테이블 만들때 시작하자 마자 새롭게 만들겠느냐
      naming:
        #physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

decorator:
  datasource:
    enabled:  true
    p6spy:
      enable-logging: true
      logging:  slf4j
      multiline:  true
logging:
  level:
    p6spy:  info  # off - error - warn - info - debug - trace
file:
  upload-dir: C:/upload