spring:
  application:
    name: lastproject

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: orcltest
    password: 1234
#    driver-class-name: oracle.jdbc.OracleDriver
#    url: ${DB_URL}
#    username: ${DB_USERNAME}
#    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB


# P6Spy를 사용하는 경우
decorator:
  datasource:
    enabled: true

    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true


logging:
  level:
    root: info

    # 개발 중 SQL 확인용
    p6spy: info

    # 우리 프로젝트 코드
    com.example.lastproject: debug


#file:
#  upload-dir: ${FILE_UPLOAD_DIR:uploads}
file:
  upload-dir: D:/kim/lastproject-upload

# 예약 문자 알림
#
# 기본값 log:
# - 실제 문자를 보내지 않고 로그로만 발송 내용을 확인합니다.
#
# 실제 NAVER Cloud SENS 사용:
# RESERVATION_SMS_PROVIDER=naver-sens
# NAVER_SENS_SERVICE_ID=...
# NAVER_SENS_ACCESS_KEY=...
# NAVER_SENS_SECRET_KEY=...
# NAVER_SENS_SENDER=등록된발신번호
reservation:
  sms:
    provider: ${RESERVATION_SMS_PROVIDER:log}

    naver-sens:
      service-id: ${NAVER_SENS_SERVICE_ID:}
      access-key: ${NAVER_SENS_ACCESS_KEY:}
      secret-key: ${NAVER_SENS_SECRET_KEY:}
      sender: ${NAVER_SENS_SENDER:}

